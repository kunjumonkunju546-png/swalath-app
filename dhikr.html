const totalDhikrCount = dhikrData.length;

function getDhikrStorageKey(index){
    return "dhikr_card_count_" + index;
}

function incrementCount(index){
    let current = Number(localStorage.getItem(getDhikrStorageKey(index)) || 0);
    current++;
    localStorage.setItem(getDhikrStorageKey(index), current);
    const elem = document.getElementById("num-" + index);
    if(elem) elem.textContent = current;
}

function resetCount(index){
    localStorage.setItem(getDhikrStorageKey(index), 0);
    const elem = document.getElementById("num-" + index);
    if(elem) elem.textContent = 0;
}
function renderRatibCards() {
    const lang = window.SwalathLanguage &&
        window.SwalathLanguage.getCurrent
        ? window.SwalathLanguage.getCurrent()
        : "en";

    const isMalayalam = lang === "ml";

    document.getElementById("ratib-heading").textContent =
        isMalayalam ? "📿 വിശുദ്ധ റാത്തീബുകൾ" : "📿 Blessed Ratibs";

    document.getElementById("ratib-cards").innerHTML = `
        <div class="ratib-card"
             onclick="openRatib('ratib-haddad.html')">
            <h3>رَاتِبُ الْحَدَّاد</h3>
            <p>${isMalayalam ? "റാത്തീബുൽ ഹദ്ദാദ്" : "Ratib Al-Haddad"}</p>
        </div>

        <div class="ratib-card"
             onclick="openRatib('ratib-attas.html')">
            <h3>رَاتِبُ الْعَطَّاس</h3>
            <p>${isMalayalam ? "റാത്തീബുൽ അത്വാസ്" : "Ratib Al-Attas"}</p>
        </div>
    `;
}

function openRatib(page) {
    window.location.href = page;
}
    
function renderDhikrCards() {
    const container = document.getElementById("dhikr-container");
    if (!container) return;

    let currentLang = "ml";
    if (window.SwalathLanguage && typeof window.SwalathLanguage.getCurrent === "function") {
        currentLang = window.SwalathLanguage.getCurrent();
    }

    let html = "";
    dhikrData.forEach((item, index) => {
        let title = item.titles[currentLang] || item.titles["ml"];
        let pronunciation = item.pronunciations[currentLang] || item.pronunciations["ml"];
        let countText = item.counts ? (item.counts[currentLang] || item.counts["ml"]) : "";
        let savedCount = localStorage.getItem(getDhikrStorageKey(index)) || 0;

        html += `
        <div class="dhikr-card">
            <div class="dhikr-title">${title}</div>
            <div class="arabic">${item.arabic}</div>
            <div class="pronunciation">${pronunciation}</div>
            ${countText ? `<div class="count">${countText}</div>` : ""}
            <div class="counter-box">
                <div class="count-display" id="count-${index}" onclick="incrementCount(${index})">📿 കൗണ്ട്: <span id="num-${index}">${savedCount}</span></div>
                <button class="reset-btn" onclick="resetCount(${index})">Reset</button>
            </div>
        </div>`;
    });

    container.innerHTML = html;
}

    if (window.SwalathLanguage &&
        typeof window.SwalathLanguage.applyLanguage === "function") {
        window.SwalathLanguage.applyLanguage(
            window.SwalathLanguage.getCurrent()
        );
    }

    renderDhikrCards();
    renderRatibCards();
});

// ലാംഗ്വേജ് മാറുമ്പോൾ ഓട്ടോമാറ്റിക്കായി കാർഡുകൾ അപ്ഡേറ്റ് ആവാൻ
document.addEventListener("swalath-language-changed", function () {
    renderDhikrCards();
    renderRatibCards();
});

</script>
