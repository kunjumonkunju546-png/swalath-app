<script>
const KAABA_LAT = 21.422487;
const KAABA_LON = 39.826206;
const LOCATION_KEY = "swalath_prayer_location_v5";

let qiblaBearing = null;
let deviceHeading = null;
let compassListening = false;
let sensorReceived = false;
let fallbackUsed = false;
let sensorTimeout = null;

function goHome() {
    window.location.href = "index.html";
}

window.addEventListener("load", function () {
    if (localStorage.getItem("swalathDarkMode") === "true") {
        document.body.classList.add("dark-mode");
    }
    loadSavedLocation();
});

function calculateBearing(lat, lon) {
    const rad = n => n * Math.PI / 180;
    const deg = n => n * 180 / Math.PI;

    const lat1 = rad(lat);
    const lat2 = rad(KAABA_LAT);
    const deltaLon = rad(KAABA_LON - lon);

    const y = Math.sin(deltaLon) * Math.cos(lat2);
    const x =
        Math.cos(lat1) * Math.sin(lat2) -
        Math.sin(lat1) * Math.cos(lat2) * Math.cos(deltaLon);

    return (deg(Math.atan2(y, x)) + 360) % 360;
}

function updateQibla(lat, lon) {
    qiblaBearing = calculateBearing(lat, lon);

    document.getElementById("bearingText").textContent =
        qiblaBearing.toFixed(1) + "°";

    document.getElementById("directionDescription").textContent =
        "വടക്കുനിന്ന് ഘടികാരദിശയിൽ " +
        qiblaBearing.toFixed(1) +
        "° ആണ് ഖിബ്‌ലയുടെ ദിശ.";

    updateCompassDisplay();
}

function getLocation() {
    const status = document.getElementById("statusMessage");
    const button = document.getElementById("locationButton");

    if (!navigator.geolocation) {
        status.textContent = "ഈ browser Location പിന്തുണയ്ക്കുന്നില്ല.";
        return;
    }

    if (!window.isSecureContext) {
        status.textContent = "HTTPS വഴി ആപ്പ് തുറക്കുക.";
        return;
    }

    button.disabled = true;
    button.textContent = "Finding Location...";
    status.textContent = "Location കണ്ടെത്തുന്നു. കാത്തിരിക്കുക.";

    navigator.geolocation.getCurrentPosition(
        function (position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            try {
                localStorage.setItem(
                    LOCATION_KEY,
                    JSON.stringify({
                        latitude: lat,
                        longitude: lon
                    })
                );
            } catch (e) {}

            document.getElementById("locationText").textContent =
                "Latitude: " + lat.toFixed(5) +
                " | Longitude: " + lon.toFixed(5);

            status.textContent = "Location ലഭിച്ചു.";
            button.disabled = false;
            button.textContent = "Refresh My Location";

            updateQibla(lat, lon);
        },
        function (error) {
            let message = "Location ലഭിച്ചില്ല.";

            if (error.code === 1) {
                message = "Browser Settings-ൽ Location permission അനുവദിക്കുക.";
            } else if (error.code === 2) {
                message = "GPS/Location ഓൺ ചെയ്ത് വീണ്ടും ശ്രമിക്കുക.";
            } else if (error.code === 3) {
                message = "കൂടുതൽ സമയം എടുത്തു. വീണ്ടും ശ്രമിക്കുക.";
            }

            status.textContent = message;
            button.disabled = false;
            button.textContent = "Try Location Again";
        },
        {
            enableHighAccuracy: true,
            timeout: 20000,
            maximumAge: 60000
        }
    );
}

function loadSavedLocation() {
    try {
        const saved = localStorage.getItem(LOCATION_KEY);

        if (saved) {
            const data = JSON.parse(saved);

            if (
                Number.isFinite(data.latitude) &&
                Number.isFinite(data.longitude)
            ) {
                document.getElementById("locationText").textContent =
                    "Saved location: " +
                    data.latitude.toFixed(5) + ", " +
                    data.longitude.toFixed(5);

                updateQibla(data.latitude, data.longitude);

                document.getElementById("statusMessage").textContent =
                    "Saved location ലഭിച്ചു. ആവശ്യമെങ്കിൽ Location പുതുക്കുക.";

                return;
            }
        }
    } catch (e) {}

    getLocation();
}

async function enableCompass() {
    const status = document.getElementById("statusMessage");

    if (!("DeviceOrientationEvent" in window)) {
        status.textContent =
            "ഈ browser ഫോണിന്റെ orientation sensor പിന്തുണയ്ക്കുന്നില്ല.";
        return;
    }

    try {
        if (typeof DeviceOrientationEvent.requestPermission === "function") {
            const permission =
                await DeviceOrientationEvent.requestPermission();

            if (permission !== "granted") {
                status.textContent =
                    "Compass sensor permission അനുവദിച്ചിട്ടില്ല.";
                return;
            }
        }

        if (!compassListening) {
            window.addEventListener(
                "deviceorientationabsolute",
                handleOrientation,
                true
            );

            window.addEventListener(
                "deviceorientation",
                handleOrientation,
                true
            );

            compassListening = true;
        }

        sensorReceived = false;
        fallbackUsed = false;

        status.textContent =
            "Compass sensor പരിശോധിക്കുന്നു. ഫോൺ പതുക്കെ തിരിക്കുക.";

        clearTimeout(sensorTimeout);

        sensorTimeout = setTimeout(function () {
            if (!sensorReceived) {
                status.textContent =
                    "ഫോണിൽ നിന്ന് Compass ദിശ ലഭിച്ചില്ല. " +
                    "ഫോൺ പിന്തുണയും Browser permission-ഉം പരിശോധിക്കുക.";
            }
        }, 5000);

    } catch (error) {
        status.textContent =
            "Compass permission ലഭിച്ചില്ല. പേജ് വീണ്ടും തുറന്ന് ശ്രമിക്കുക.";
    }
}

function handleOrientation(event) {
    let heading = null;
    let isReliableNorthHeading = false;

    // ചില ഫോണുകൾ നേരിട്ട് compass heading നൽകുന്നു.
    if (typeof event.webkitCompassHeading === "number") {
        heading = event.webkitCompassHeading;
        isReliableNorthHeading = true;
    }

    // Absolute orientation ലഭിക്കുന്ന ഉപകരണങ്ങൾ.
    else if (
        event.absolute === true &&
        typeof event.alpha === "number"
    ) {
        heading = 360 - event.alpha;
        isReliableNorthHeading = true;
    }

    // ചില Android browser-കൾ absolute=false ആയിട്ടും alpha നൽകും.
    // ഇത് ഫോൺ തിരിയുന്നത് തിരിച്ചറിയാൻ സഹായിക്കും; വടക്കിന്റെ
    // കൃത്യമായ ദിശയാണെന്ന് ഉറപ്പില്ല.
    else if (
        typeof event.alpha === "number" &&
        Number.isFinite(event.alpha)
    ) {
        heading = 360 - event.alpha;
        fallbackUsed = true;
    }

    if (heading === null || !Number.isFinite(heading)) {
        return;
    }

    sensorReceived = true;
    clearTimeout(sensorTimeout);

    deviceHeading = (heading + 360) % 360;

    updateCompassDisplay();

    if (fallbackUsed && !isReliableNorthHeading) {
        document.getElementById("statusMessage").textContent =
            "ഫോൺ ചലനം കണ്ടെത്തി. എന്നാൽ വടക്കിന്റെ കൃത്യമായ ദിശ " +
            "സെൻസർ സ്ഥിരീകരിച്ചിട്ടില്ല; അമ്പിന്റെ കൃത്യത ഉറപ്പില്ല.";
    } else {
        document.getElementById("statusMessage").textContent =
            "Compass sensor പ്രവർത്തിക്കുന്നു. കൂടുതൽ കൃത്യതയ്ക്കായി " +
            "ലോഹങ്ങളിൽനിന്ന് അകന്ന് ഫോൺ പതുക്കെ തിരിക്കുക.";
    }
}

function updateCompassDisplay() {
    const needle = document.getElementById("compassNeedle");

    if (qiblaBearing === null) return;

    if (deviceHeading === null) {
        // Sensor ലഭിക്കുന്നതുവരെ വടക്കിനെ അടിസ്ഥാനമാക്കിയുള്ള
        // കണക്കാക്കിയ ദിശ മാത്രം കാണിക്കുന്നു.
        needle.style.transform = "rotate(" + qiblaBearing + "deg)";
        return;
    }

    const relativeAngle =
        (qiblaBearing - deviceHeading + 360) % 360;

    needle.style.transform =
        "rotate(" + relativeAngle + "deg)";
}
</script>
