<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quran MP3 - Swalath</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

body.dark{
    background:#121212;
    color:#fff;
}

header{
    background:#075e54;
    color:white;
    padding:15px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:100;
}

header h2{
    margin:0;
    font-size:21px;
}

.top-buttons{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
}

button{
    border:0;
    border-radius:8px;
    padding:10px 14px;
    cursor:pointer;
    font-size:14px;
}

.back-btn{
    background:white;
    color:#075e54;
}

.dark-btn{
    background:#222;
    color:white;
}

.container{
    max-width:700px;
    margin:auto;
    padding:15px;
}

.player-box{
    background:white;
    padding:18px;
    border-radius:14px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

body.dark .player-box{
    background:#1e1e1e;
}

.now-playing{
    text-align:center;
    font-weight:bold;
    margin-bottom:12px;
}

audio{
    width:100%;
}

.controls{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:12px;
    flex-wrap:wrap;
}

.controls button{
    background:#075e54;
    color:white;
}

.full-btn{
    width:100%;
    margin-top:12px;
    background:#d4a017 !important;
    color:white !important;
    font-weight:bold;
}

.search{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:10px;
    margin-bottom:15px;
    font-size:15px;
}

body.dark .search{
    background:#222;
    color:white;
    border-color:#444;
}

.download-full{
    width:100%;
    background:#075e54;
    color:white;
    margin-bottom:10px;
}

.progress-box{
    display:none;
    margin:10px 0;
}

.progress{
    width:100%;
    height:10px;
}

.progress-text{
    text-align:center;
    font-size:13px;
    margin-top:5px;
}

.surah-card{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    box-shadow:0 1px 5px rgba(0,0,0,.08);
}

body.dark .surah-card{
    background:#1e1e1e;
}

.surah-info{
    flex:1;
}

.number{
    font-weight:bold;
    color:#075e54;
}

body.dark .number{
    color:#4dd0c4;
}

.arabic{
    font-size:18px;
    direction:rtl;
    margin-bottom:4px;
}

.english{
    font-size:13px;
    opacity:.7;
}

.surah-actions{
    display:flex;
    gap:5px;
}

.play-btn{
    background:#075e54;
    color:white;
}

.download-btn{
    background:#777;
    color:white;
}

.completed{
    text-align:center;
    font-weight:bold;
    color:#075e54;
    margin-top:10px;
}

body.dark .completed{
    color:#4dd0c4;
}

</style>
</head>

<body>

<header>

<h2>📖 Quran MP3</h2>

<div class="top-buttons">

<button class="back-btn" onclick="goBack()">
← Back
</button>

<button class="dark-btn" onclick="toggleDarkMode()">
🌙 Dark
</button>

</div>

</header>


<div class="container">


<!-- FULL QURAN DOWNLOAD -->

<button
class="download-full"
onclick="downloadFullQuran()">

⬇️ Download Full Quran Offline

</button>


<div
class="progress-box"
id="progressBox">

<progress
class="progress"
id="downloadProgress"
value="0"
max="114">
</progress>

<div
class="progress-text"
id="progressText">

Preparing...

</div>

</div>


<!-- PLAYER -->

<div class="player-box">

<div
class="now-playing"
id="nowPlaying">

Select a Surah

</div>


<audio
id="audio"
controls
preload="metadata">
</audio>


<div class="controls">

<button onclick="previousSurah()">
⏮ Previous
</button>

<button
onclick="togglePlay()"
id="playPauseBtn">

▶ Play

</button>

<button onclick="nextSurah()">
Next ⏭
</button>

</div>


<button
class="full-btn"
onclick="playFullQuran()">

▶️ Play Full Quran

</button>


</div>


<!-- SEARCH -->

<input
type="text"
id="searchInput"
class="search"
placeholder="🔎 Search Surah..."
oninput="searchSurah()">


<!-- SURAHS -->

<div id="surahList"></div>


</div>


<script>

/* =====================================
   QURAN AUDIO SETTINGS
===================================== */

const AUDIO_BASE =
"https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/";

const CACHE_NAME =
"swalath-quran-mp3-128kbps-v2";

const TOTAL_SURAHS = 114;


/* =====================================
   SURAHS
===================================== */

const surahs = [

[1,"الفاتحة","Al-Fatihah"],
[2,"البقرة","Al-Baqarah"],
[3,"آل عمران","Aal-Imran"],
[4,"النساء","An-Nisa"],
[5,"المائدة","Al-Ma'idah"],
[6,"الأنعام","Al-An'am"],
[7,"الأعراف","Al-A'raf"],
[8,"الأنفال","Al-Anfal"],
[9,"التوبة","At-Tawbah"],
[10,"يونس","Yunus"],
[11,"هود","Hud"],
[12,"يوسف","Yusuf"],
[13,"الرعد","Ar-Ra'd"],
[14,"إبراهيم","Ibrahim"],
[15,"الحجر","Al-Hijr"],
[16,"النحل","An-Nahl"],
[17,"الإسراء","Al-Isra"],
[18,"الكهف","Al-Kahf"],
[19,"مريم","Maryam"],
[20,"طه","Ta-Ha"],
[21,"الأنبياء","Al-Anbiya"],
[22,"الحج","Al-Hajj"],
[23,"المؤمنون","Al-Mu'minun"],
[24,"النور","An-Nur"],
[25,"الفرقان","Al-Furqan"],
[26,"الشعراء","Ash-Shu'ara"],
[27,"النمل","An-Naml"],
[28,"القصص","Al-Qasas"],
[29,"العنكبوت","Al-Ankabut"],
[30,"الروم","Ar-Rum"],
[31,"لقمان","Luqman"],
[32,"السجدة","As-Sajdah"],
[33,"الأحزاب","Al-Ahzab"],
[34,"سبأ","Saba"],
[35,"فاطر","Fatir"],
[36,"يس","Ya-Sin"],
[37,"الصافات","As-Saffat"],
[38,"ص","Sad"],
[39,"الزمر","Az-Zumar"],
[40,"غافر","Ghafir"],
[41,"فصلت","Fussilat"],
[42,"الشورى","Ash-Shura"],
[43,"الزخرف","Az-Zukhruf"],
[44,"الدخان","Ad-Dukhan"],
[45,"الجاثية","Al-Jathiyah"],
[46,"الأحقاف","Al-Ahqaf"],
[47,"محمد","Muhammad"],
[48,"الفتح","Al-Fath"],
[49,"الحجرات","Al-Hujurat"],
[50,"ق","Qaf"],
[51,"الذاريات","Adh-Dhariyat"],
[52,"الطور","At-Tur"],
[53,"النجم","An-Najm"],
[54,"القمر","Al-Qamar"],
[55,"الرحمن","Ar-Rahman"],
[56,"الواقعة","Al-Waqi'ah"],
[57,"الحديد","Al-Hadid"],
[58,"المجادلة","Al-Mujadilah"],
[59,"الحشر","Al-Hashr"],
[60,"الممتحنة","Al-Mumtahanah"],
[61,"الصف","As-Saff"],
[62,"الجمعة","Al-Jumu'ah"],
[63,"المنافقون","Al-Munafiqun"],
[64,"التغابن","At-Taghabun"],
[65,"الطلاق","At-Talaq"],
[66,"التحريم","At-Tahrim"],
[67,"الملك","Al-Mulk"],
[68,"القلم","Al-Qalam"],
[69,"الحاقة","Al-Haqqah"],
[70,"المعارج","Al-Ma'arij"],
[71,"نوح","Nuh"],
[72,"الجن","Al-Jinn"],
[73,"المزمل","Al-Muzzammil"],
[74,"المدثر","Al-Muddaththir"],
[75,"القيامة","Al-Qiyamah"],
[76,"الإنسان","Al-Insan"],
[77,"المرسلات","Al-Mursalat"],
[78,"النبأ","An-Naba"],
[79,"النازعات","An-Nazi'at"],
[80,"عبس","Abasa"],
[81,"التكوير","At-Takwir"],
[82,"الانفطار","Al-Infitar"],
[83,"المطففين","Al-Mutaffifin"],
[84,"الانشقاق","Al-Inshiqaq"],
[85,"البروج","Al-Buruj"],
[86,"الطارق","At-Tariq"],
[87,"الأعلى","Al-A'la"],
[88,"الغاشية","Al-Ghashiyah"],
[89,"الفجر","Al-Fajr"],
[90,"البلد","Al-Balad"],
[91,"الشمس","Ash-Shams"],
[92,"الليل","Al-Layl"],
[93,"الضحى","Ad-Duha"],
[94,"الشرح","Ash-Sharh"],
[95,"التين","At-Tin"],
[96,"العلق","Al-Alaq"],
[97,"القدر","Al-Qadr"],
[98,"البينة","Al-Bayyinah"],
[99,"الزلزلة","Az-Zalzalah"],
[100,"العاديات","Al-Adiyat"],
[101,"القارعة","Al-Qari'ah"],
[102,"التكاثر","At-Takathur"],
[103,"العصر","Al-Asr"],
[104,"الهمزة","Al-Humazah"],
[105,"الفيل","Al-Fil"],
[106,"قريش","Quraysh"],
[107,"الماعون","Al-Ma'un"],
[108,"الكوثر","Al-Kawthar"],
[109,"الكافرون","Al-Kafirun"],
[110,"النصر","An-Nasr"],
[111,"المسد","Al-Masad"],
[112,"الإخلاص","Al-Ikhlas"],
[113,"الفلق","Al-Falaq"],
[114,"الناس","An-Nas"]
];


/* =====================================
   VARIABLES
===================================== */

const audio =
document.getElementById("audio");

const nowPlaying =
document.getElementById("nowPlaying");

const playPauseBtn =
document.getElementById("playPauseBtn");

const surahList =
document.getElementById("surahList");

let currentSurah =
parseInt(
localStorage.getItem("quranCurrentSurah")
) || 1;

let fullQuranMode = false;

let objectUrl = null;


/* =====================================
   URL
===================================== */

function getAudioUrl(number){

return AUDIO_BASE + number + ".mp3";

}


/* =====================================
   RENDER SURAHS
===================================== */

function renderSurahs(list = surahs){

surahList.innerHTML = "";

list.forEach(function(surah){

const number = surah[0];
const arabic = surah[1];
const english = surah[2];

const card =
document.createElement("div");

card.className =
"surah-card";

card.innerHTML = `

<div class="surah-info">

<div class="number">
${number}. ${english}
</div>

<div class="arabic">
${arabic}
</div>

<div class="english">
Surah ${number}
</div>

</div>

<div class="surah-actions">

<button
class="play-btn"
onclick="playSurah(${number})">

▶

</button>

<button
class="download-btn"
onclick="downloadSurah(${number})">

⬇️

</button>

</div>

`;

surahList.appendChild(card);

});

}


/* =====================================
   PLAY SURAH
===================================== */

async function playSurah(number){

try{

currentSurah = number;

localStorage.setItem(
"quranCurrentSurah",
number
);

const surah =
surahs[number - 1];

if(!surah){
return;
}

nowPlaying.innerHTML =
"▶ " + number + ". " + surah[2];


/* Save current full mode */

const continueFullQuran =
fullQuranMode;


/* =====================================
   CHECK CACHE
===================================== */

let audioUrl =
getAudioUrl(number);

let cache =
await caches.open(CACHE_NAME);

let response =
await cache.match(audioUrl);


/* =====================================
   USE OFFLINE FILE
===================================== */

if(response){

const blob =
await response.blob();

if(objectUrl){

URL.revokeObjectURL(objectUrl);

}

objectUrl =
URL.createObjectURL(blob);

audio.src =
objectUrl;

}

/* =====================================
   ONLINE
===================================== */

else{

audio.src =
audioUrl;

}


audio.load();


/* =====================================
   RESTORE POSITION
===================================== */

const savedPosition =
parseFloat(
localStorage.getItem(
"quranPosition_" + number
)
) || 0;


audio.addEventListener(
"loadedmetadata",
function restorePosition(){

audio.currentTime =
Math.min(
savedPosition,
audio.duration || 0
);

audio.removeEventListener(
"loadedmetadata",
restorePosition
);

},
{once:true}
);


/* =====================================
   PLAY
===================================== */

await audio.play();

playPauseBtn.innerHTML =
"⏸ Pause";


/* Restore Full Quran mode */

fullQuranMode =
continueFullQuran;


/* =====================================
   MEDIA SESSION
===================================== */

if("mediaSession" in navigator){

navigator.mediaSession.metadata =
new MediaMetadata({

title:
surah[2],

artist:
"Quran - Alafasy",

album:
"Swalath Quran MP3"

});

}

}

catch(error){

console.log(
"Audio play error:",
error
);

playPauseBtn.innerHTML =
"▶ Play";

}

}


/* =====================================
   PLAY / PAUSE
===================================== */

async function togglePlay(){

if(!audio.src){

await playSurah(currentSurah);

return;

}

if(audio.paused){

try{

await audio.play();

playPauseBtn.innerHTML =
"⏸ Pause";

}
catch(error){

console.log(error);

}

}

else{

audio.pause();

playPauseBtn.innerHTML =
"▶ Play";

}

}


/* =====================================
   NEXT
===================================== */

function nextSurah(){

if(currentSurah < TOTAL_SURAHS){

fullQuranMode = false;

playSurah(
currentSurah + 1
);

}

}


/* =====================================
   PREVIOUS
===================================== */

function previousSurah(){

if(currentSurah > 1){

fullQuranMode = false;

playSurah(
currentSurah - 1
);

}

}


/* =====================================
   PLAY FULL QURAN
===================================== */

function playFullQuran(){

fullQuranMode = true;

playSurah(currentSurah);

}


/* =====================================
   ⭐ AUTO NEXT SURAH
===================================== */

audio.addEventListener(
"ended",
function(){

console.log(
"Surah ended:",
currentSurah
);


/* Reset saved position */

localStorage.setItem(
"quranPosition_" + currentSurah,
"0"
);


/* =====================================
   CONTINUE FULL QURAN
===================================== */

if(
fullQuranMode === true &&
currentSurah < TOTAL_SURAHS
){

const nextNumber =
currentSurah + 1;


/* VERY IMPORTANT:
   Keep Full Quran mode ON */

fullQuranMode = true;


/* Small delay for Android */

setTimeout(
async function(){

try{

await playSurah(
nextNumber
);

/* Make sure it remains ON */

fullQuranMode = true;

}
catch(error){

console.log(
"Auto next error:",
error
);

}

},
150
);

}


/* =====================================
   QURAN FINISHED
===================================== */

else{

fullQuranMode = false;

playPauseBtn.innerHTML =
"▶ Play";

if(
currentSurah >= TOTAL_SURAHS
){

nowPlaying.innerHTML =
"✅ Quran completed";

}

}

});


/* =====================================
   SAVE POSITION
===================================== */

audio.addEventListener(
"timeupdate",
function(){

if(currentSurah){

localStorage.setItem(
"quranPosition_" + currentSurah,
audio.currentTime
);

}

});


/* =====================================
   PLAY EVENT
===================================== */

audio.addEventListener(
"play",
function(){

playPauseBtn.innerHTML =
"⏸ Pause";

});


/* =====================================
   PAUSE EVENT
===================================== */

audio.addEventListener(
"pause",
function(){

if(!audio.ended){

playPauseBtn.innerHTML =
"▶ Play";

}

});


/* =====================================
   SEARCH
===================================== */

function searchSurah(){

const value =
document
.getElementById("searchInput")
.value
.toLowerCase()
.trim();

const filtered =
surahs.filter(function(surah){

return (

surah[0].toString()
.includes(value)

||

surah[1]
.includes(value)

||

surah[2]
.toLowerCase()
.includes(value)

);

});

renderSurahs(filtered);

}


/* =====================================
   DOWNLOAD ONE SURAH
===================================== */

async function downloadSurah(number){

try{

const url =
getAudioUrl(number);

const cache =
await caches.open(CACHE_NAME);

const existing =
await cache.match(url);

if(existing){

alert(
"ഈ Surah ഇതിനകം offline ആയി save ചെയ്തിട്ടുണ്ട്."
);

return;

}


const response =
await fetch(url);

if(!response.ok){

throw new Error(
"Download failed"
);

}


await cache.put(
url,
response.clone()
);


alert(
"Surah " +
number +
" offline ആയി save ചെയ്തു."
);

}

catch(error){

console.log(error);

alert(
"Download failed. Internet connection പരിശോധിക്കുക."
);

}

}


/* =====================================
   DOWNLOAD FULL QURAN
===================================== */

async function downloadFullQuran(){

const progressBox =
document.getElementById(
"progressBox"
);

const progress =
document.getElementById(
"downloadProgress"
);

const progressText =
document.getElementById(
"progressText"
);


progressBox.style.display =
"block";

progress.value = 0;

progress.max =
TOTAL_SURAHS;

progressText.innerHTML =
"Preparing...";


try{

const cache =
await caches.open(
CACHE_NAME
);


for(
let i = 1;
i <= TOTAL_SURAHS;
i++
){

const url =
getAudioUrl(i);


/* Already downloaded? */

const existing =
await cache.match(url);


if(!existing){

const response =
await fetch(url);

if(!response.ok){

throw new Error(
"Failed at Surah " + i
);

}

await cache.put(
url,
response.clone()
);

}


progress.value =
i;

progressText.innerHTML =
"Downloading Surah " +
i +
" / " +
TOTAL_SURAHS;


/* Give browser some breathing time */

await new Promise(
resolve =>
setTimeout(
resolve,
50
)
);

}


progressText.innerHTML =
"✅ Full Quran downloaded for offline use";

alert(
"Full Quran offline download completed."
);

}

catch(error){

console.log(error);

progressText.innerHTML =
"❌ Download failed";

alert(
"Full Quran download failed. Internet connection പരിശോധിക്കുക."
);

}

}


/* =====================================
   DARK MODE
===================================== */

function toggleDarkMode(){

document.body.classList.toggle(
"dark"
);

const enabled =
document.body.classList.contains(
"dark"
);

localStorage.setItem(
"quranDarkMode",
enabled
);

}


/* =====================================
   LOAD DARK MODE
===================================== */

if(
localStorage.getItem(
"quranDarkMode"
) === "true"
){

document.body.classList.add(
"dark"
);

}


/* =====================================
   BACK BUTTON
===================================== */

function goBack(){

history.back();

}


/* =====================================
   MEDIA SESSION
===================================== */

if("mediaSession" in navigator){

navigator.mediaSession.setActionHandler(
"play",
function(){

audio.play();

}
);


navigator.mediaSession.setActionHandler(
"pause",
function(){

audio.pause();

}
);


navigator.mediaSession.setActionHandler(
"nexttrack",
function(){

nextSurah();

}
);


navigator.mediaSession.setActionHandler(
"previoustrack",
function(){

previousSurah();

}
);

}


/* =====================================
   INITIAL LOAD
===================================== */

renderSurahs();


/* =====================================
   RESTORE CURRENT SURAH
===================================== */

if(currentSurah >= 1 &&
currentSurah <= TOTAL_SURAHS){

const saved =
surahs[currentSurah - 1];

if(saved){

nowPlaying.innerHTML =
"Last Surah: " +
currentSurah +
". " +
saved[2];

}

}

</script>

</body>
</html>
