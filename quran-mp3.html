<title>Quran MP3 - Swalath</title>

<style>

body{

header{

}

}

header p{

}

.top-buttons{

}

button{

.back-btn{

}

.dark-btn{

}

.container{

}

.download-box{

body.dark .download-box{

.progress{

.progress-bar{

.status{

.player{

.surah-number{

}

}

.surah-en{

}

.card-buttons{

    gap:7px;
}

.play-btn{

</head>


<body>


<header>

    <h1>القرآن الكريم</h1>

    <p>
        Quran MP3 • Mishary Rashid Alafasy
    </p>

</header>


<div class="top-buttons">

    <button
        class="back-btn"
        onclick="goBack()">

        ← Back

    </button>


    <button
        class="dark-btn"
        onclick="toggleDark()">

        🌙 Dark Mode

    </button>

</div>


<div class="container">


<!-- =====================================
     FULL DOWNLOAD
===================================== -->

<div class="download-box">

    <button
        class="download-btn"
        id="fullDownloadBtn"
        onclick="downloadFullQuran()">

        ⬇️ Download Full Quran

    </button>


    <div class="progress">

        <div
            class="progress-bar"
            id="progressBar">
        </div>

    </div>


    <div
        class="status"
        id="downloadStatus">

        Ready

    </div>

</div>



<!-- =====================================
     PLAYER
===================================== -->

<div class="player">

    <div
        class="now-playing"
        id="nowPlaying">

        Select a Surah

    </div>


    <audio
        id="audioPlayer"
        controls
        preload="metadata">
    </audio>


    <div class="controls">

            onclick="previousSurah()">

            ⏮ Previous

        <button
            class="main-play"
            id="playPauseBtn"

            ▶ Play

        </button>


        <button
            class="control-btn"
            onclick="nextSurah()">

            Next ⏭

        </button>

    </div>


    <div
        class="controls"
        style="margin-top:10px;">

        <button
            class="control-btn"
            onclick="playFullQuran()">

            ▶ Play Full Quran

    </div>


    <div
        class="error"
        id="audioError">

        Audio player error.
        Please try again.

    </div>

</div>



<!-- =====================================
     SEARCH
===================================== -->

<input
    type="text"
    id="searchBox"
    class="search"
    placeholder="🔎 Search Surah..."
    oninput="searchSurahs()"
>



<!-- =====================================
     SURAHS
===================================== -->

<div
    class="surah-list"
    id="surahList">
</div>


</div>



<script>


/* =====================================

===================================== */

/* =====================================

[114,"الناس","An-Nas"]

const surahList =
surahs.map(x => ({

    n:x[0],
    ar:x[1],
    en:x[2]

}));


/* =====================================
   VARIABLES
===================================== */

const audio =
document.getElementById("audioPlayer");

const nowPlaying =
document.getElementById("nowPlaying");

const playPauseBtn =
document.getElementById("playPauseBtn");

const audioError =
document.getElementById("audioError");

const progressBar =
document.getElementById("progressBar");

const downloadStatus =
document.getElementById("downloadStatus");

const fullDownloadBtn =
document.getElementById("fullDownloadBtn");


let currentSurah =
parseInt(
    localStorage.getItem(
        "quranCurrentSurah"
    )
) || 1;


let fullQuranMode = false;


/*
 * Current Blob URL.
 *
 * Only the currently playing
 * cached audio is converted to
 * a Blob URL.
 */

let currentBlobUrl = null;


/* =====================================
   AUDIO URL
===================================== */

function getAudioUrl(number){

    return AUDIO_BASE +
           number +
           ".mp3";

}


/* =====================================
   GET CACHE
===================================== */

async function getQuranCache(){

    return await caches.open(
        CACHE_NAME
    );

}


/* =====================================
   CHECK IF SURAH IS DOWNLOADED
===================================== */

async function isSurahCached(number){

    try{

        const cache =
        await getQuranCache();

        const response =
        await cache.match(
            getAudioUrl(number)
        );

        return !!response;

    }catch(error){

        console.log(
            "Cache check error:",
            error
        );

        return false;

    }

}


/* =====================================
   RENDER SURAHS
===================================== */

function renderSurahs(
    list = surahList
){

    const container =
    document.getElementById(
        "surahList"
    );

    container.innerHTML = "";


    list.forEach(surah => {

        const card =
        document.createElement(
            "div"
        );

        card.className =
        "surah-card";


        card.innerHTML = `

            <div class="surah-number">
                Surah ${surah.n}
            </div>

            <div class="surah-ar">
                ${surah.ar}
            </div>

            <div class="surah-en">
                ${surah.en}
            </div>

            <div class="card-buttons">

                <button
                    class="play-btn"
                    onclick="playSurah(${surah.n})">

                    ▶ Play

                </button>

                <button
                    class="download-small"
                    onclick="downloadSurah(${surah.n})">

                    ⬇

                </button>

            </div>

        `;


        container.appendChild(card);

    });

}


/* =====================================
   LOAD AUDIO
   FROM CACHE OR INTERNET
===================================== */

async function loadAudioSource(number){

    const url =
    getAudioUrl(number);


    /*
     * First check offline cache.
     */

    try{

        const cache =
        await getQuranCache();

        const cachedResponse =
        await cache.match(url);


        if(cachedResponse){

            const blob =
            await cachedResponse.blob();


            if(blob.size > 0){

                if(currentBlobUrl){

                    URL.revokeObjectURL(
                        currentBlobUrl
                    );

                }


                currentBlobUrl =
                URL.createObjectURL(
                    blob
                );


                audio.src =
                currentBlobUrl;

                audio.load();


                return true;

            }

        }

    }catch(error){

        console.log(
            "Cache playback error:",
            error
        );

    }


    /*
     * If not cached, use the
     * original online URL.
     */

    audio.src = url;

    audio.load();

    return false;

}


/* =====================================
   PLAY SURAH
===================================== */

async function playSurah(number){

    currentSurah = number;


    localStorage.setItem(
        "quranCurrentSurah",
        number
    );


    const surah =
    surahList.find(
        s => s.n === number
    );


    if(!surah){

        return;

    }


    audioError.style.display =
    "none";


    nowPlaying.innerHTML =
    `▶ ${surah.n}. ${surah.en} — ${surah.ar}`;


    /*
     * Save whether this is a full
     * Quran session before changing
     * the source.
     */

    const continueFullQuran =
    fullQuranMode;


    /*
     * Remember current saved position.
     */

    const savedPosition =
    parseFloat(
        localStorage.getItem(
            "quranPosition_" +
            number
        )
    );


    try{

        await loadAudioSource(
            number
        );


        /*
         * Restore previous position
         * after metadata becomes available.
         */

        if(
            savedPosition &&
            savedPosition > 0
        ){

            const restore =
            function(){

                if(
                    isFinite(audio.duration) &&
                    savedPosition <
                    audio.duration
                ){

                    try{

                        audio.currentTime =
                        savedPosition;

                    }catch(e){}

                }


                audio.removeEventListener(
                    "loadedmetadata",
                    restore
                );

            };


            audio.addEventListener(
                "loadedmetadata",
                restore
            );

        }


        /*
         * Update Media Session.
         */

        updateMediaSession(
            surah
        );


        /*
         * Start playback.
         */

        await audio.play();


        playPauseBtn.innerHTML =
        "⏸ Pause";


        /*
         * Make sure full Quran mode
         * remains active.
         */

        fullQuranMode =
        continueFullQuran;


    }catch(error){

        console.log(
            "Audio play error:",
            error
        );


        playPauseBtn.innerHTML =
        "▶ Play";


        audioError.style.display =
        "block";


        if(
            navigator.onLine === false
        ){

            audioError.innerHTML =
            "This Surah is not downloaded for offline listening.";

        }else{

            audioError.innerHTML =
            "Audio player error. Please try again.";

        }

    }

}


/* =====================================
   PLAY / PAUSE
===================================== */

async function togglePlay(){

    try{

        if(!audio.src){

            await playSurah(
                currentSurah
            );

            return;

        }


        if(audio.paused){

            await audio.play();

            playPauseBtn.innerHTML =
            "⏸ Pause";

        }else{

            audio.pause();

            playPauseBtn.innerHTML =
            "▶ Play";

        }

    }catch(error){

        console.log(
            "Play/Pause error:",
            error
        );

        audioError.style.display =
        "block";

    }

}


/* =====================================
   NEXT
===================================== */

function nextSurah(){

    if(
        currentSurah <
        TOTAL_SURAHS
    ){

        playSurah(
            currentSurah + 1
        );

    }

}


/* =====================================
   PREVIOUS
===================================== */

function previousSurah(){

    if(
        currentSurah >
        1
    ){

        playSurah(
            currentSurah - 1
        );

    }

}


/* =====================================
   FULL QURAN
===================================== */

async function playFullQuran(){

    fullQuranMode = true;


    await playSurah(
        currentSurah
    );

}


/* =====================================
   AUTO NEXT
===================================== */

audio.addEventListener(
    "ended",
    async function(){

        /*
         * Save end position.
         */

        localStorage.setItem(
            "quranPosition_" +
            currentSurah,
            "0"
        );


        if(
            fullQuranMode &&
            currentSurah <
            TOTAL_SURAHS
        ){

            const next =
            currentSurah + 1;


            /*
             * Keep full Quran mode ON.
             */

            fullQuranMode = true;


            await playSurah(
                next
            );

        }else{

            fullQuranMode = false;


            playPauseBtn.innerHTML =
            "▶ Play";


            if(
                currentSurah >=
                TOTAL_SURAHS
            ){

                nowPlaying.innerHTML =
                "Quran completed";

            }

        }

    }
);


/* =====================================
   AUDIO EVENTS
===================================== */

audio.addEventListener(
    "playing",
    function(){

        playPauseBtn.innerHTML =
        "⏸ Pause";


        audioError.style.display =
        "none";

    }
);


audio.addEventListener(
    "pause",
    function(){

        if(!audio.ended){

            playPauseBtn.innerHTML =
            "▶ Play";

        }

    }
);


audio.addEventListener(
    "error",
    function(){

        console.log(
            "Browser audio error"
        );


        playPauseBtn.innerHTML =
        "▶ Play";


        audioError.style.display =
        "block";

    }
);


/* =====================================
   SAVE POSITION
===================================== */

audio.addEventListener(
    "timeupdate",
    function(){

        if(
            audio.currentTime > 0 &&
            currentSurah
        ){

            localStorage.setItem(
                "quranPosition_" +
                currentSurah,
                audio.currentTime
            );

        }

    }
);


/* =====================================
   SEARCH
===================================== */

function searchSurahs(){

    const query =
    document
    .getElementById(
        "searchBox"
    )
    .value
    .toLowerCase()
    .trim();


    const filtered =
    surahList.filter(
        surah =>

        surah.en
        .toLowerCase()
        .includes(query)

        ||

        surah.ar
        .includes(query)

        ||

        String(surah.n)
        .includes(query)

    );


    renderSurahs(
        filtered
    );

}


/* =====================================
   DOWNLOAD ONE SURAH
===================================== */

async function downloadSurah(number){

    const url =
    getAudioUrl(number);


    downloadStatus.innerHTML =
    `Checking Surah ${number}...`;


    try{

        const cache =
        await getQuranCache();


        /*
         * Check existing cache.
         */

        const existing =
        await cache.match(url);


        if(existing){

            downloadStatus.innerHTML =
            `Surah ${number} already saved offline ✓`;

            return;

        }


        /*
         * Download directly.
         *
         * This no longer depends on
         * Service Worker postMessage.
         */

        downloadStatus.innerHTML =
        `Downloading Surah ${number}...`;


        const response =
        await fetch(
            url,
            {
                method:"GET",
                cache:"no-store"
            }
        );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        /*
         * Store the response in Cache API.
         */

        await cache.put(
            url,
            response.clone()
        );


        downloadStatus.innerHTML =
        `Surah ${number} saved offline ✓`;


    }catch(error){

        console.log(
            "Quran download error:",
            error
        );


        downloadStatus.innerHTML =
        `Could not download Surah ${number}`;


        /*
         * If the normal fetch fails,
         * try the existing Service Worker
         * as a backup.
         */

        try{

            await serviceWorkerDownload(
                url,
                number
            );

        }catch(swError){

            console.log(
                "Service Worker backup failed:",
                swError
            );

        }

    }

}


/* =====================================
   SERVICE WORKER BACKUP DOWNLOAD
===================================== */

function serviceWorkerDownload(
    url,
    number
){

    return new Promise(
        (resolve,reject) => {

            if(
                !navigator.serviceWorker ||
                !navigator.serviceWorker.controller
            ){

                reject(
                    new Error(
                        "Service Worker unavailable"
                    )
                );

                return;

            }


            const messageChannel =
            new MessageChannel();


            const timeout =
            setTimeout(
                () => {

                    reject(
                        new Error(
                            "Service Worker timeout"
                        )
                    );

                },
                60000
            );


            messageChannel
            .port1
            .onmessage =
            function(event){

                clearTimeout(
                    timeout
                );


                if(
                    event.data &&
                    event.data.success
                ){

                    downloadStatus.innerHTML =
                    `Surah ${number} saved offline ✓`;

                    resolve(
                        event.data
                    );

                }else{

                    reject(
                        new Error(
                            event.data?.error ||
                            "Service Worker download failed"
                        )
                    );

                }

            };


            navigator
            .serviceWorker
            .controller
            .postMessage(

                {
                    type:
                    "CACHE_QURAN",

                    url:url
                },

                [
                    messageChannel.port2
                ]

            );

        }
    );

}


/* =====================================
   DOWNLOAD FULL QURAN
===================================== */

async function downloadFullQuran(){

    const confirmed =
    confirm(
        "Download all 114 Surahs for offline listening?"
    );


    if(!confirmed){

        return;

    }


    fullDownloadBtn.disabled =
    true;


    progressBar.style.width =
    "0%";


    let successful =
    0;


    let failed =
    0;


    try{

        const cache =
        await getQuranCache();


        for(
            let i = 1;
            i <= TOTAL_SURAHS;
            i++
        ){

            const url =
            getAudioUrl(i);


            downloadStatus.innerHTML =
            `Checking ${i} / 114...`;


            try{

                /*
                 * Check if already downloaded.
                 */

                const existing =
                await cache.match(url);


                if(existing){

                    successful++;

                }else{

                    downloadStatus.innerHTML =
                    `Downloading ${i} / 114...`;


                    /*
                     * Direct download.
                     */

                    const response =
                    await fetch(
                        url,
                        {
                            method:"GET",
                            cache:"no-store"
                        }
                    );


                    if(!response.ok){

                        throw new Error(
                            "HTTP " +
                            response.status
                        );

                    }


                    await cache.put(
                        url,
                        response.clone()
                    );


                    successful++;

                }

            }catch(error){

                console.log(
                    "Direct download failed:",
                    i,
                    error
                );


                /*
                 * Try Service Worker as backup.
                 */

                try{

                    await serviceWorkerDownload(
                        url,
                        i
                    );


                    successful++;

                }catch(swError){

                    console.log(
                        "Service Worker failed:",
                        i,
                        swError
                    );


                    failed++;

                }

            }


            const percent =
            (
                i /
                TOTAL_SURAHS
            ) * 100;


            progressBar.style.width =
            percent + "%";

        }


        if(
            successful ===
            TOTAL_SURAHS
        ){

            downloadStatus.innerHTML =
            "Full Quran downloaded ✓";

        }else{

            downloadStatus.innerHTML =
            `${successful} / 114 Surahs saved offline`;

            if(failed > 0){

                downloadStatus.innerHTML +=
                ` • ${failed} failed`;

            }

        }

    }catch(error){

        console.log(
            "Full Quran download error:",
            error
        );


        downloadStatus.innerHTML =
        "Download process failed.";

    }


    fullDownloadBtn.disabled =
    false;

}


/* =====================================

===================================== */

function toggleDark(){

    document.body.classList.toggle(
        "dark"
    );


    localStorage.setItem(
        "quranDarkMode",
        document.body.classList.contains(
            "dark"
        )
    );

}


if(
    localStorage.getItem(
        "quranDarkMode"
    ) === "true"
){

    document.body.classList.add(
        "dark"
    );

}


/* =====================================
   BACK BUTTON
===================================== */

function goBack(){

    if(
        document.referrer &&
        document.referrer !==
        location.href
    ){

        history.back();

    }else{

        window.location.href =
        "swalath.html";

    }

}


/* =====================================
   MEDIA SESSION
===================================== */

function updateMediaSession(
    surah
){

    if(
        "mediaSession" in navigator
    ){

        try{

            navigator.mediaSession.metadata =
            new MediaMetadata({

                title:
                `${surah.en} — ${surah.ar}`,

                artist:
                "Mishary Rashid Alafasy",

                album:
                "Quran MP3 • Swalath"

            });

        }catch(error){

            console.log(
                "MediaSession metadata error:",
                error
            );

        }

    }

}


/* =====================================
   MEDIA SESSION CONTROLS
===================================== */

if(
    "mediaSession" in navigator
){

    try{

        navigator.mediaSession.setActionHandler(
            "play",
            async () => {

                try{

                    await audio.play();

                }catch(e){

                    console.log(e);

                }

            }
        );


        navigator.mediaSession.setActionHandler(
            "pause",
            () => {

                audio.pause();

            }
        );


        navigator.mediaSession.setActionHandler(
            "previoustrack",
            () => {

                previousSurah();

            }
        );


        navigator.mediaSession.setActionHandler(
            "nexttrack",
            () => {

                nextSurah();

            }
        );

    }catch(error){

        console.log(
            "MediaSession setup error:",
            error
        );

    }

}
