<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quran MP3 - Swalath</title>
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222;}
body.dark{background:#121212;color:#fff;}
header{background:#075e54;color:white;padding:15px;text-align:center;position:sticky;top:0;z-index:100;}
header h2{margin:0;font-size:21px;}
.top-buttons{display:flex;justify-content:space-between;margin-top:10px;}
button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-size:14px;}
.back-btn{background:white;color:#075e54;}
.dark-btn{background:#222;color:white;}
.container{max-width:700px;margin:auto;padding:15px;}
.player-box{background:white;padding:18px;border-radius:14px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,.1);}
body.dark .player-box{background:#1e1e1e;}
.now-playing{text-align:center;font-weight:bold;margin-bottom:12px;}
audio{width:100%;}
.controls{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap;}
.controls button{background:#075e54;color:white;}
.full-btn{width:100%;margin-top:12px;background:#d4a017 !important;color:white !important;font-weight:bold;}
.search{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;margin-bottom:15px;font-size:15px;}
body.dark .search{background:#222;color:white;border-color:#444;}
.download-full{width:100%;background:#075e54;color:white;margin-bottom:10px;font-weight:bold;text-align:center;display:block;text-decoration:none;padding:12px;border-radius:8px;}
.surah-card{background:white;border-radius:12px;padding:15px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 1px 5px rgba(0,0,0,.08);}
body.dark .surah-card{background:#1e1e1e;}
.surah-info{flex:1;}
.number{font-weight:bold;color:#075e54;}
body.dark .number{color:#4dd0c4;}
.arabic{font-size:18px;direction:rtl;margin-bottom:4px;}
.english{font-size:13px;opacity:.7;}
.surah-actions{display:flex;gap:5px;}
.play-btn{background:#075e54;color:white;}
.download-btn{background:#777;color:white;text-decoration:none;padding:8px 12px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;}
</style>
</head>

<body>

<header>
<h2>📖 Quran MP3</h2>
<div class="top-buttons">
<button class="back-btn" onclick="goBack()">← Back</button>
<button class="dark-btn" onclick="toggleDarkMode()">🌙 Dark</button>
</div>
</header>

<div class="container">

<a href="https://www.mp3quran.net/eng/afs" target="_blank" class="download-full">
⬇️ Open Full Quran Download Center
</a>

<div class="player-box">
<div class="now-playing" id="nowPlaying">Select a Surah</div>
<audio id="audio" controls preload="metadata"></audio>
<div class="controls">
<button onclick="previousSurah()">⏮ Previous</button>
<button onclick="togglePlay()" id="playPauseBtn">▶ Play</button>
<button onclick="nextSurah()">Next ⏭</button>
</div>
<button class="full-btn" onclick="playFullQuran()">▶️ Play Full Quran</button>
</div>

<input type="text" id="searchInput" class="search" placeholder="🔎 Search Surah..." oninput="searchSurah()">

<div id="surahList"></div>

</div>

<script>
const AUDIO_BASE = "https://server8.mp3quran.net/afs/";
const TOTAL_SURAHS = 114;

const surahs = [
[1,"الفاتحة","Al-Fatihah"],
[2,"البقرة","Al-Baqarah"],
[3,"آل عمران","Aal-Imran"],
[4,"النساء","An-Nisa"],

[10,"يونس","Yunus"],

[13,"الرعد","Ar-Ra'd"],
[14,"إبراهيم","Ibrahim"],
[15,"الحجر","Al-Hijr"],

[19,"مريم","Maryam"],

[21,"الأنبياء","Al-Anbiya"],
[22,"الحج","Al-Hajj"],

[24,"النور","An-Nur"],

[37,"الصافات","As-Saffat"],

[40,"غافر","Ghafir"],
[41,"فصلت","Fussilat"],
[42,"الشورى","Ash-Shura"],
[43,"الزخرف","Az-Zukhruf"],
[44,"الدخان","Ad-Dukhan"],
[45,"الجاثية","Al-Jathiyah"],
[46,"الأحقاف","Al-Ahqaf"],
[47,"محمد","Muhammad"],
[48,"الفتح","Al-Fath"],

[52,"الطور","At-Tur"],

[54,"القمر","Al-Qamar"],
[55,"الرحمن","Ar-Rahman"],
[56,"الواقعة","Al-Waqi'ah"],
[57,"الحديد","Al-Hadid"],
[58,"المجادلة","Al-Mujadilah"],
[59,"الحشر","Al-Hashr"],
[60,"الممتحنة","Al-Mumtahanah"],
[61,"الصف","As-Saff"],

[73,"المزمل","Al-Muzzammil"],
[74,"المدثر","Al-Muddaththir"],
[75,"القيامة","Al-Qiyamah"],
[76,"الإنسان","Al-Insan"],

[78,"النبأ","An-Naba"],
[79,"النازعات","An-Nazi'at"],
[80,"عبس","Abasa"],
[81,"التكوير","At-Takwir"],
[82,"الانفطار","Al-Infitar"],
[83,"المطففين","Al-Mutaffifin"],

[85,"البروج","Al-Buruj"],
[86,"الطارق","At-Tariq"],
[87,"الأعلى","Al-A'la"],
[88,"الغاشية","Al-Ghashiyah"],
[89,"الفجر","Al-Fajr"],

[101,"القارعة","Al-Qari'ah"],
[102,"التكاثر","At-Takathur"],
[103,"العصر","Al-Asr"],
[104,"الهمزة","Al-Humazah"],
[105,"الفيل","Al-Fil"],
[106,"قريش","Quraysh"],
[107,"الماعون","Al-Ma'un"],
[108,"الكوثر","Al-Kawthar"],
[109,"الكافرون","Al-Kafirun"],
[110,"النصر","An-Nasr"],
[111,"المسد","Al-Masad"],
[112,"الإخلاص","Al-Ikhlas"],
[113,"الفلق","Al-Falaq"],
[114,"الناس","An-Nas"]
];

const audio = document.getElementById("audio");
const nowPlaying = document.getElementById("nowPlaying");
const playPauseBtn = document.getElementById("playPauseBtn");
const surahList = document.getElementById("surahList");

let currentSurah = parseInt(localStorage.getItem("quranCurrentSurah")) || 1;
let fullQuranMode = false;

function formatNumber(num) {
    return String(num).padStart(3, '0');
}

function getAudioUrl(number){
    return AUDIO_BASE + formatNumber(number) + ".mp3";
}

function renderSurahs(list = surahs){
    surahList.innerHTML = "";
    list.forEach(function(surah){
        const number = surah[0];
        const arabic = surah[1];
        const english = surah[2];
        const audioUrl = getAudioUrl(number);

        const card = document.createElement("div");
        card.className = "surah-card";
        card.innerHTML = `
            <div class="surah-info">
                <div class="number">${number}. ${english}</div>
                <div class="arabic">${arabic}</div>
                <div class="english">Surah ${number}</div>
            </div>
            <div class="surah-actions">
                <button class="play-btn" onclick="playSurah(${number})">▶</button>
                <a href="${audioUrl}" class="download-btn" target="_blank" download>⬇️</a>
            </div>
        `;
        surahList.appendChild(card);
    });
}

async function playSurah(number){
    try{
        currentSurah = number;
        localStorage.setItem("quranCurrentSurah", number);
        const surah = surahs[number - 1];
        if(!surah) return;

        nowPlaying.innerHTML = "▶ " + number + ". " + surah[2];
        audio.src = getAudioUrl(number);
        audio.load();

        await audio.play();
        playPauseBtn.innerHTML = "⏸ Pause";
    } catch(error){
        console.log("Audio play error:", error);
        playPauseBtn.innerHTML = "▶ Play";
    }
}

async function togglePlay(){
    if(!audio.src){
        await playSurah(currentSurah);
        return;
    }
    if(audio.paused){
        try{
            await audio.play();
            playPauseBtn.innerHTML = "⏸ Pause";
        }catch(error){ console.log(error); }
    } else {
        audio.pause();
        playPauseBtn.innerHTML = "▶ Play";
    }
}

function nextSurah(){
    if(currentSurah < TOTAL_SURAHS){
        fullQuranMode = false;
        playSurah(currentSurah + 1);
    }
}

function previousSurah(){
    if(currentSurah > 1){
        fullQuranMode = false;
        playSurah(currentSurah - 1);
    }
}

function playFullQuran(){
    fullQuranMode = true;
    playSurah(currentSurah);
}

audio.addEventListener("ended", function(){
    if(fullQuranMode === true && currentSurah < TOTAL_SURAHS){
        playSurah(currentSurah + 1);
    } else {
        fullQuranMode = false;
        playPauseBtn.innerHTML = "▶ Play";
        if(currentSurah >= TOTAL_SURAHS){
            nowPlaying.innerHTML = "✅ Quran completed";
        }
    }
});

audio.addEventListener("play", function(){ playPauseBtn.innerHTML = "⏸ Pause"; });
audio.addEventListener("pause", function(){ if(!audio.ended) playPauseBtn.innerHTML = "▶ Play"; });

function searchSurah(){
    const value = document.getElementById("searchInput").value.toLowerCase().trim();
    const filtered = surahs.filter(function(surah){
        return surah[0].toString().includes(value) || surah[1].includes(value) || surah[2].toLowerCase().includes(value);
    });
    renderSurahs(filtered);
}

function toggleDarkMode(){
    document.body.classList.toggle("dark");
    localStorage.setItem("quranDarkMode", document.body.classList.contains("dark"));
}

if(localStorage.getItem("quranDarkMode") === "true"){
    document.body.classList.add("dark");
}

function goBack(){
    history.back();
}

renderSurahs();
</script>
</body>
</html>
