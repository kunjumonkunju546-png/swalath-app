HTML

<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#075e54">
<title>Quran MP3 - Swalath</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f8f6;color:#202b27}
body.dark{background:#121815;color:#fff}

header{
  background:linear-gradient(135deg,#064e3b,#087f68);
  color:white;padding:19px 16px;text-align:center;
  position:sticky;top:0;z-index:10;
  box-shadow:0 4px 16px rgba(0,50,35,.12)
}
header h2{margin:0;font-size:22px;letter-spacing:.2px}
.top-buttons{display:flex;justify-content:space-between;margin-top:13px}
button{border:0;border-radius:10px;padding:10px 13px;cursor:pointer;font-size:14px}
button:disabled{opacity:.55;cursor:not-allowed}
.back-btn{background:#fff;color:#075e54}
.dark-btn{background:#173a30;color:white}

.container{max-width:720px;margin:auto;padding:17px 14px}

.player-box,.storage-box,.surah-card{
  background:white;border:1px solid rgba(7,94,84,.08);
  border-radius:16px;margin-bottom:13px;
  box-shadow:0 4px 18px rgba(20,50,40,.055)
}
.player-box{padding:20px 16px}
.storage-box{padding:16px}
.now-playing{
  text-align:center;font-weight:bold;font-size:16px;
  line-height:1.6;margin-bottom:13px;color:#075e54
}
body.dark .now-playing{color:#80cbc4}
audio{width:100%}

.controls{
  display:flex;justify-content:center;gap:8px;
  flex-wrap:wrap;margin-top:12px
}
.controls button,.play-btn{background:#075e54;color:white}
.full-btn{
  width:100%;margin-top:12px;background:#c69b43;
  color:white;font-weight:bold;padding:13px
}

.download-full{
  display:block;width:100%;text-decoration:none;text-align:center;
  padding:13px;border-radius:11px;margin-bottom:13px;
  background:#075e54;color:white;font-weight:bold
}

.search{
  width:100%;padding:14px;border:1px solid #e2e8e4;
  border-radius:12px;margin-bottom:14px;font-size:15px;
  background:white;outline-color:#087f68
}
body.dark .search{background:#202822;color:white;border-color:#38443c}

.surah-card{
  padding:14px;display:flex;align-items:center;
  justify-content:space-between;gap:10px
}
.surah-info{flex:1;min-width:0}
.number{font-weight:bold;font-size:14px;color:#075e54}
body.dark .number{color:#80cbc4}
.arabic{font-size:21px;direction:rtl;margin:5px 0;line-height:1.7}
.english{font-size:12px;opacity:.65}
.surah-actions{display:flex;gap:6px;flex-shrink:0}
.play-btn,.download-btn{min-width:41px;min-height:40px;border-radius:10px}
.download-btn{background:#e7f2ed;color:#075e54}
body.dark .download-btn{background:#263e36;color:#a7e3cb}

.status{font-size:12px;margin-top:6px;opacity:.75;overflow-wrap:anywhere}
.progress-box{margin:12px 0;font-size:13px}
progress{width:100%;height:7px;accent-color:#087f68}
#stopBtn{background:#e9eeeb;color:#33483e}
body.dark #stopBtn{background:#303b34;color:white}
body.dark .player-box,
body.dark .storage-box,
body.dark .surah-card{background:#1e2721;border-color:#303a35}

@media(max-width:400px){
  .container{padding:13px 10px}
  .surah-card{padding:11px}
  .surah-actions{gap:4px}
  .surah-actions button{padding:9px}
  .arabic{font-size:19px}
}
</style>
</head>

<body>
<header>
  <h2>📖 Quran MP3</h2>
  <div class="top-buttons">
    <button class="back-btn" onclick="goBack()">← Back</button>
    <button class="dark-btn" onclick="toggleDarkMode()">🌙 Dark</button>
  </div>
</header>

<div class="container">

  <a href="https://www.mp3quran.net/eng/afs"
     target="_blank" rel="noopener" class="download-full">
    🌐 Official Quran Download Center
  </a>

  <div class="storage-box">
    <strong>📥 Offline Quran</strong>
    <div id="savedCount" class="status">Loading saved surahs...</div>

    <div class="progress-box">
      <div id="progressText">Download progress: 0%</div>
      <progress id="downloadProgress" value="0" max="100"></progress>
    </div>

    <button id="fullDownloadBtn" class="download-full"
      onclick="downloadFullQuran()">⬇️ Download Full Quran</button>

    <button id="stopBtn" onclick="stopFullDownload()" disabled>
      Stop Download
    </button>

    <div id="downloadMessage" class="status" role="status"></div>
  </div>

  <div class="player-box">
    <div class="now-playing" id="nowPlaying">Select a Surah</div>
    <audio id="audio" controls preload="metadata"></audio>

    <div class="controls">
      <button onclick="previousSurah()">⏮ Previous</button>
      <button onclick="togglePlay()" id="playPauseBtn">▶ Play</button>
      <button onclick="nextSurah()">Next ⏭</button>
    </div>

    <button class="full-btn" onclick="playFullQuran()">
      ▶️ Play Full Quran
    </button>
  </div>

  <input type="search" id="searchInput" class="search"
    placeholder="🔎 Search Surah..." oninput="searchSurah()">

  <div id="surahList"></div>
</div>

<script>
"use strict";

const AUDIO_BASE = "https://server8.mp3quran.net/afs/";
const TOTAL_SURAHS = 114;
const DB_NAME = "SwalathQuranAudio";
const DB_VERSION = 1;
const STORE_NAME = "surahs";

const surahs = [
[1,"الفاتحة","Al-Fatihah"],[2,"البقرة","Al-Baqarah"],
[3,"آل عمران","Aal-Imran"],[4,"النساء","An-Nisa"],
[5,"المائدة","Al-Ma'idah"],[6,"الأنعام","Al-An'am"],
[7,"الأعراف","Al-A'raf"],[8,"الأنفال","Al-Anfal"],
[9,"التوبة","At-Tawbah"],[10,"يونس","Yunus"],
[11,"هود","Hud"],[12,"يوسف","Yusuf"],
[13,"الرعد","Ar-Ra'd"],[14,"إبراهيم","Ibrahim"],
[15,"الحجر","Al-Hijr"],[16,"النحل","An-Nahl"],
[17,"الإسراء","Al-Isra"],[18,"الكهف","Al-Kahf"],
[19,"مريم","Maryam"],[20,"طه","Ta-Ha"],
[21,"الأنبياء","Al-Anbiya"],[22,"الحج","Al-Hajj"],
[23,"المؤمنون","Al-Mu'minun"],[24,"النور","An-Nur"],
[25,"الفرقان","Al-Furqan"],[26,"الشعراء","Ash-Shu'ara"],
[27,"النمل","An-Naml"],[28,"القصص","Al-Qasas"],
[29,"العنكبوت","Al-Ankabut"],[30,"الروم","Ar-Rum"],
[31,"لقمان","Luqman"],[32,"السجدة","As-Sajdah"],
[33,"الأحزاب","Al-Ahzab"],[34,"سبأ","Saba"],
[35,"فاطر","Fatir"],[36,"يس","Ya-Sin"],
[37,"الصافات","As-Saffat"],[38,"ص","Sad"],
[39,"الزمر","Az-Zumar"],[40,"غافر","Ghafir"],
[41,"فصلت","Fussilat"],[42,"الشورى","Ash-Shura"],
[43,"الزخرف","Az-Zukhruf"],[44,"الدخان","Ad-Dukhan"],
[45,"الجاثية","Al-Jathiyah"],[46,"الأحقاف","Al-Ahqaf"],
[47,"محمد","Muhammad"],[48,"الفتح","Al-Fath"],
[49,"الحجرات","Al-Hujurat"],[50,"ق","Qaf"],
[51,"الذاريات","Adh-Dhariyat"],[52,"الطور","At-Tur"],
[53,"النجم","An-Najm"],[54,"القمر","Al-Qamar"],
[55,"الرحمن","Ar-Rahman"],[56,"الواقعة","Al-Waqi'ah"],
[57,"الحديد","Al-Hadid"],[58,"المجادلة","Al-Mujadilah"],
[59,"الحشر","Al-Hashr"],[60,"الممتحنة","Al-Mumtahanah"],
[61,"الصف","As-Saff"],[62,"الجمعة","Al-Jumu'ah"],
[63,"المنافقون","Al-Munafiqun"],[64,"التغابن","At-Taghabun"],
[65,"الطلاق","At-Talaq"],[66,"التحريم","At-Tahrim"],
[67,"الملك","Al-Mulk"],[68,"القلم","Al-Qalam"],
[69,"الحاقة","Al-Haqqah"],[70,"المعارج","Al-Ma'arij"],
[71,"نوح","Nuh"],[72,"الجن","Al-Jinn"],
[73,"المزمل","Al-Muzzammil"],[74,"المدثر","Al-Muddaththir"],
[75,"القيامة","Al-Qiyamah"],[76,"الإنسان","Al-Insan"],
[77,"المرسلات","Al-Mursalat"],[78,"النبأ","An-Naba"],
[79,"النازعات","An-Nazi'at"],[80,"عبس","Abasa"],
[81,"التكوير","At-Takwir"],[82,"الانفطار","Al-Infitar"],
[83,"المطففين","Al-Mutaffifin"],[84,"الانشقاق","Al-Inshiqaq"],
[85,"البروج","Al-Buruj"],[86,"الطارق","At-Tariq"],
[87,"الأعلى","Al-A'la"],[88,"الغاشية","Al-Ghashiyah"],
[89,"الفجر","Al-Fajr"],[90,"البلد","Al-Balad"],
[91,"الشمس","Ash-Shams"],[92,"الليل","Al-Layl"],
[93,"الضحى","Ad-Duha"],[94,"الشرح","Ash-Sharh"],
[95,"التين","At-Tin"],[96,"العلق","Al-Alaq"],
[97,"القدر","Al-Qadr"],[98,"البينة","Al-Bayyinah"],
[99,"الزلزلة","Az-Zalzalah"],[100,"العاديات","Al-Adiyat"],
[101,"القارعة","Al-Qari'ah"],[102,"التكاثر","At-Takathur"],
[103,"العصر","Al-Asr"],[104,"الهمزة","Al-Humazah"],
[105,"الفيل","Al-Fil"],[106,"قريش","Quraysh"],
[107,"الماعون","Al-Ma'un"],[108,"الكوثر","Al-Kawthar"],
[109,"الكافرون","Al-Kafirun"],[110,"النصر","An-Nasr"],
[111,"المسد","Al-Masad"],[112,"الإخلاص","Al-Ikhlas"],
[113,"الفلق","Al-Falaq"],[114,"الناس","An-Nas"]
];

const audio = document.getElementById("audio");
const nowPlaying = document.getElementById("nowPlaying");
const playPauseBtn = document.getElementById("playPauseBtn");
const surahList = document.getElementById("surahList");
const downloadMessage = document.getElementById("downloadMessage");
const progress = document.getElementById("downloadProgress");
const progressText = document.getElementById("progressText");
const fullDownloadBtn = document.getElementById("fullDownloadBtn");
const stopBtn = document.getElementById("stopBtn");

let currentSurah = Number(localStorage.getItem("quranCurrentSurah")) || 1;
let fullQuranMode = false;
let stopRequested = false;
let activeObjectUrl = null;
let dbPromise = null;
let downloadInProgress = false;

function formatNumber(n) {
  return String(n).padStart(3, "0");
}

function getAudioUrl(n) {
  return AUDIO_BASE + formatNumber(n) + ".mp3";
}

function openDatabase() {
  if (dbPromise) return dbPromise;

  dbPromise = new Promise((resolve, reject) => {
    if (!("indexedDB" in window)) {
      reject(new Error("Offline storage unavailable"));
      return;
    }

    const request = indexedDB.open(DB_NAME, DB_VERSION);

    request.onupgradeneeded = () => {
      const database = request.result;
      if (!database.objectStoreNames.contains(STORE_NAME)) {
        database.createObjectStore(STORE_NAME, { keyPath: "number" });
      }
    };

    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error("Database error"));
  });

  return dbPromise;
}

async function getSavedSurah(n) {
  const database = await openDatabase();

  return new Promise((resolve, reject) => {
    const transaction = database.transaction(STORE_NAME, "readonly");
    const request = transaction.objectStore(STORE_NAME).get(n);
    request.onsuccess = () => resolve(request.result || null);
    request.onerror = () => reject(request.error);
  });
}

async function saveSurah(n, blob) {
  const database = await openDatabase();

  return new Promise((resolve, reject) => {
    const transaction = database.transaction(STORE_NAME, "readwrite");

    transaction.objectStore(STORE_NAME).put({
      number: n,
      blob: blob,
      savedAt: Date.now()
    });

    transaction.oncomplete = () => resolve();
    transaction.onerror = () => reject(transaction.error);
    transaction.onabort = () => reject(transaction.error || new Error("Save failed"));
  });
}

async function getSavedNumbers() {
  const database = await openDatabase();

  return new Promise((resolve, reject) => {
    const transaction = database.transaction(STORE_NAME, "readonly");
    const request = transaction.objectStore(STORE_NAME).getAllKeys();

    request.onsuccess = () => resolve(request.result.map(Number));
    request.onerror = () => reject(request.error);
  });
}

async function refreshSavedCount() {
  try {
    const saved = await getSavedNumbers();

    document.getElementById("savedCount").textContent =
      saved.length + " of " + TOTAL_SURAHS + " surahs saved";

    renderSurahs();
  } catch (error) {
    document.getElementById("savedCount").textContent =
      "Offline storage unavailable";
  }
}

function setMessage(message) {
  downloadMessage.textContent = message;
}

function setProgress(done, total) {
  const percent = total ? Math.round(done / total * 100) : 0;
  progress.value = percent;
  progressText.textContent =
    "Download progress: " + percent + "% (" + done + "/" + total + ")";
}

async function downloadSurah(n) {
  const saved = await getSavedSurah(n);

  if (saved) {
    setMessage("Surah " + n + " is already saved.");
    return;
  }

  setMessage("Downloading Surah " + n + "...");

  const response = await fetch(getAudioUrl(n), { mode: "cors" });

  if (!response.ok) {
    throw new Error("Server response: " + response.status);
  }

  const blob = await response.blob();

  if (!blob.size) throw new Error("Empty audio file received");

  if (blob.type && !blob.type.includes("audio") &&
      !blob.type.includes("octet-stream")) {
    throw new Error("Audio file unavailable from server");
  }

  await saveSurah(n, blob);

  setMessage("Surah " + n + " saved for offline playback.");
  await refreshSavedCount();
}

function renderSurahs(list = surahs) {
  surahList.innerHTML = "";

  list.forEach(surah => {
    const n = surah[0];

    const card = document.createElement("div");
    card.className = "surah-card";

    const info = document.createElement("div");
    info.className = "surah-info";

    const title = document.createElement("div");
    title.className = "number";
    title.textContent = n + ". " + surah[2];

    const arabic = document.createElement("div");
    arabic.className = "arabic";
    arabic.textContent = surah[1];

    const subtitle = document.createElement("div");
    subtitle.className = "english";
    subtitle.textContent = "Surah " + n;

    const status = document.createElement("div");
    status.className = "status";
    status.id = "status-" + n;
    status.textContent = "Checking...";

    info.append(title, arabic, subtitle, status);

    const actions = document.createElement("div");
    actions.className = "surah-actions";

    const playBtn = document.createElement("button");
    playBtn.className = "play-btn";
    playBtn.textContent = "▶";
    playBtn.title = "Play Surah";
    playBtn.setAttribute("aria-label", "Play Surah " + n);
    playBtn.onclick = () => playSurah(n);

    const downloadBtn = document.createElement("button");
    downloadBtn.className = "download-btn";
    downloadBtn.textContent = "⬇";
    downloadBtn.title = "Download Surah";
    downloadBtn.setAttribute("aria-label", "Download Surah " + n);

    downloadBtn.onclick = async () => {
      downloadBtn.disabled = true;

      try {
        await downloadSurah(n);
      } catch (error) {
        setMessage("Download failed. Check connection or audio server.");
      } finally {
        downloadBtn.disabled = false;
        updateCardStatus(n);
      }
    };

    actions.append(playBtn, downloadBtn);
    card.append(info, actions);
    surahList.appendChild(card);

    updateCardStatus(n);
  });
}

async function updateCardStatus(n) {
  const status = document.getElementById("status-" + n);
  if (!status) return;

  try {
    const saved = await getSavedSurah(n);
    status.textContent = saved ? "✓ Saved offline" : "";
  } catch (error) {
    status.textContent = "";
  }
}

async function playSurah(n) {
  try {
    currentSurah = n;
    localStorage.setItem("quranCurrentSurah", String(n));

    const surah = surahs[n - 1];
    if (!surah) return;

    nowPlaying.textContent = "Loading " + n + ". " + surah[2];

    const saved = await getSavedSurah(n);
    let source;

    if (saved && saved.blob) {
      if (activeObjectUrl) URL.revokeObjectURL(activeObjectUrl);

      activeObjectUrl = URL.createObjectURL(saved.blob);
      source = activeObjectUrl;
      nowPlaying.textContent = "📥 " + n + ". " + surah[2] + " · Offline";
    } else {
      source = getAudioUrl(n);
      nowPlaying.textContent = "🌐 " + n + ". " + surah[2];
    }

    audio.src = source;
    audio.load();
    await audio.play();

    playPauseBtn.textContent = "⏸ Pause";
  } catch (error) {
    console.error(error);
    playPauseBtn.textContent = "▶ Play";
    setMessage("Unable to play. Check your connection or download the surah first.");
  }
}

async function togglePlay() {
  if (!audio.src) {
    await playSurah(currentSurah);
    return;
  }

  if (audio.paused) {
    try {
      await audio.play();
    } catch (error) {
      setMessage("Unable to start playback.");
    }
  } else {
    audio.pause();
  }
}

function nextSurah() {
  if (currentSurah < TOTAL_SURAHS) {
    playSurah(currentSurah + 1);
  }
}

function previousSurah() {
  if (currentSurah > 1) {
    playSurah(currentSurah - 1);
  }
}

function playFullQuran() {
  fullQuranMode = true;
  playSurah(currentSurah);
}

audio.addEventListener("ended", () => {
  if (fullQuranMode && currentSurah < TOTAL_SURAHS) {
    playSurah(currentSurah + 1);
  } else {
    fullQuranMode = false;
    playPauseBtn.textContent = "▶ Play";

    if (currentSurah === TOTAL_SURAHS) {
      nowPlaying.textContent = "✓ Quran completed";
    }
  }
});

audio.addEventListener("play", () => {
  playPauseBtn.textContent = "⏸ Pause";
});

audio.addEventListener("pause", () => {
  if (!audio.ended) playPauseBtn.textContent = "▶ Play";
});

async function downloadFullQuran() {
  if (downloadInProgress) return;

  downloadInProgress = true;
  stopRequested = false;
  fullDownloadBtn.disabled = true;
  stopBtn.disabled = false;

  try {
    const savedNumbers = await getSavedNumbers();
    let done = savedNumbers.length;

    setProgress(done, TOTAL_SURAHS);

    for (let n = 1; n <= TOTAL_SURAHS; n++) {
      if (stopRequested) {
        setMessage("Download paused. Press Download Full Quran to continue.");
        break;
      }

      if (savedNumbers.includes(n)) continue;

      try {
        await downloadSurah(n);
        done++;
        setProgress(done, TOTAL_SURAHS);
      } catch (error) {
        setMessage("Download stopped at Surah " + n +
          ". Check your internet connection or audio server.");
        break;
      }
    }

    const latest = await getSavedNumbers();
    setProgress(latest.length, TOTAL_SURAHS);

    if (!stopRequested && latest.length === TOTAL_SURAHS) {
      setMessage("Full Quran download complete.");
    }
  } catch (error) {
    setMessage("Offline storage unavailable.");
  } finally {
    downloadInProgress = false;
    fullDownloadBtn.disabled = false;
    stopBtn.disabled = true;
    await refreshSavedCount();
  }
}

function stopFullDownload() {
  stopRequested = true;
  stopBtn.disabled = true;
  setMessage("Stopping after the current surah...");
}

function searchSurah() {
  const value = document.getElementById("searchInput").value
    .toLowerCase().trim();

  const filtered = surahs.filter(surah =>
    String(surah[0]).includes(value) ||
    surah[1].includes(value) ||
    surah[2].toLowerCase().includes(value)
  );

  renderSurahs(filtered);
}

function toggleDarkMode() {
  document.body.classList.toggle("dark");

  localStorage.setItem(
    "quranDarkMode",
    document.body.classList.contains("dark")
  );
}

function goBack() {
  if (history.length > 1) {
    history.back();
  } else {
    location.href = "../index.html";
  }
}

if (localStorage.getItem("quranDarkMode") === "true") {
  document.body.classList.add("dark");
}

renderSurahs();
refreshSavedCount();
</script>
</body>
</html>
