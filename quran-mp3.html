const surahList =
surahs.map(x => ({
    n:x[0],
    ar:x[1],
    en:x[2]
}));



/* =====================================
   VARIABLES
===================================== */

const audio =
document.getElementById("audioPlayer");

const nowPlaying =
document.getElementById("nowPlaying");

const playPauseBtn =
document.getElementById("playPauseBtn");

const audioError =
document.getElementById("audioError");

const progressBar =
document.getElementById("progressBar");

const downloadStatus =
document.getElementById("downloadStatus");


let currentSurah =
parseInt(
    localStorage.getItem(
        "quranCurrentSurah"
    )
) || 1;


let fullQuranMode = false;

let currentObjectUrl = null;



/* =====================================
   AUDIO URL
===================================== */

function getAudioUrl(number){

    return AUDIO_BASE +
           number +
           ".mp3";

}



/* =====================================
   RENDER SURAHS
===================================== */

function renderSurahs(
    list = surahList
){

    const container =
    document.getElementById(
        "surahList"
    );

    container.innerHTML = "";


    list.forEach(surah => {

        const card =
        document.createElement(
            "div"
        );

        card.className =
        "surah-card";


        card.innerHTML = `

            <div class="surah-number">
                Surah ${surah.n}
            </div>

            <div class="surah-ar">
                ${surah.ar}
            </div>

            <div class="surah-en">
                ${surah.en}
            </div>

            <div class="card-buttons">

                <button
                    class="play-btn"
                    onclick="playSurah(${surah.n})">

                    ▶ Play

                </button>

                <button
                    class="download-small"
                    onclick="downloadSurah(${surah.n})">

                    ⬇

                </button>

            </div>

        `;

        container.appendChild(card);

    });

}



/* =====================================
   PLAY SURAH
===================================== */

async function playSurah(number){

    currentSurah = number;

    localStorage.setItem(
        "quranCurrentSurah",
        number
    );

    fullQuranMode = false;

    const surah =
    surahList.find(
        s => s.n === number
    );

    if(!surah) return;

    audioError.style.display =
    "none";

    nowPlaying.innerHTML =
    `▶ ${surah.n}. ${surah.en} — ${surah.ar}`;


    try{

        const url =
        getAudioUrl(number);


        /*
         * TRY OFFLINE CACHE FIRST
         */

        try{

            const cache =
            await caches.open(
                CACHE_NAME
            );

            const cached =
            await cache.match(url);


            if(cached){

                const blob =
                await cached.blob();


                if(currentObjectUrl){

                    URL.revokeObjectURL(
                        currentObjectUrl
                    );

                }


                currentObjectUrl =
                URL.createObjectURL(
                    blob
                );


                audio.src =
                currentObjectUrl;

            }else{

                audio.src =
                url;

            }


        }catch(cacheError){

            console.log(
                "Cache unavailable:",
                cacheError
            );

            audio.src =
            url;

        }


        audio.load();


        /*
         * RESTORE POSITION
         */

        const savedPosition =
        parseFloat(
            localStorage.getItem(
                "quranPosition_" +
                number
            )
        );


        if(
            savedPosition &&
            savedPosition > 0
        ){

            audio.addEventListener(
                "loadedmetadata",
                function restorePosition(){

                    if(
                        savedPosition <
                        audio.duration
                    ){

                        audio.currentTime =
                        savedPosition;

                    }

                    audio.removeEventListener(
                        "loadedmetadata",
                        restorePosition
                    );

                }
            );

        }


        await audio.play();


        playPauseBtn.innerHTML =
        "⏸ Pause";


        updateMediaSession(
            surah
        );


    }catch(error){

        console.log(
            "Audio error:",
            error
        );

        playPauseBtn.innerHTML =
        "▶ Play";

        audioError.style.display =
        "block";

    }

}



/* =====================================
   PLAY / PAUSE
===================================== */

async function togglePlay(){

    if(!audio.src){

        await playSurah(
            currentSurah
        );

        return;

    }

    try{

        if(audio.paused){

            await audio.play();

            playPauseBtn.innerHTML =
            "⏸ Pause";

        }else{

            audio.pause();

            playPauseBtn.innerHTML =
            "▶ Play";

        }

    }catch(error){

        console.log(error);

        audioError.style.display =
        "block";

    }

}



/* =====================================
   NEXT
===================================== */

function nextSurah(){

    if(
        currentSurah <
        TOTAL_SURAHS
    ){

        playSurah(
            currentSurah + 1
        );

    }

}



/* =====================================
   PREVIOUS
===================================== */

function previousSurah(){

    if(
        currentSurah > 1
    ){

        playSurah(
            currentSurah - 1
        );

    }

}



/* =====================================
   FULL QURAN
===================================== */
async function downloadSurah(number){

    const url = getAudioUrl(number);

    downloadStatus.innerHTML =
        `Preparing Surah ${number}...`;

    try{

        const cache =
            await caches.open(CACHE_NAME);

        /*
         * First check whether already cached
         */

        const existing =
            await cache.match(url);

        if(existing){

            downloadStatus.innerHTML =
                `Surah ${number} already saved offline ✓`;

            return;
        }

        /*
         * Ask Service Worker to cache
         */

        if(
            navigator.serviceWorker &&
            navigator.serviceWorker.controller
        ){

            const messageChannel =
                new MessageChannel();

            const result =
                new Promise((resolve) => {

                    messageChannel.port1.onmessage =
                        function(event){

                            resolve(
                                event.data
                            );

                        };

                });

            navigator.serviceWorker.controller.postMessage(
                {
                    type:"CACHE_QURAN",
                    url:url
                },
                [
                    messageChannel.port2
                ]
            );

            const response =
                await result;

            if(response && response.success){

                downloadStatus.innerHTML =
                    `Surah ${number} saved offline ✓`;

            }else{

                throw new Error(
                    response?.error ||
                    "Service Worker cache failed"
                );

            }

        }else{

            throw new Error(
                "Service Worker not active"
            );

        }

    }catch(error){

        console.log(
            "Quran download error:",
            error
        );

        downloadStatus.innerHTML =
            `Could not download Surah ${number}`;

    }

}

    fullQuranMode = true;

    await playSurah(
        currentSurah
    );

    fullQuranMode = true;

}



/* =====================================
   AUTO NEXT
===================================== */

audio.addEventListener(
    "ended",
    function(){

        if(fullQuranMode){

            if(
                currentSurah <
                TOTAL_SURAHS
            ){

                playSurah(
                    currentSurah + 1
                ).then(() => {

                    fullQuranMode = true;

                });

            }else{

                fullQuranMode =
                false;

                nowPlaying.innerHTML =
                "Quran completed";

                playPauseBtn.innerHTML =
                "▶ Play";

            }

        }else{

            playPauseBtn.innerHTML =
            "▶ Play";

        }

    }
);

===================================== */

audio.addEventListener(
    "playing",
    function(){

audio.addEventListener(

audio.addEventListener(

===================================== */

            audio.currentTime > 0 &&
            currentSurah

            localStorage.setItem(
                "quranPosition_" +

                audio.currentTime

/* =====================================
   SEARCH
===================================== */

function searchSurahs(){

    const query =
    document
    .getElementById(
        "searchBox"
    )
    .value
    .toLowerCase()
    .trim();


    const filtered =
    surahList.filter(
        surah =>

        surah.en
        .toLowerCase()
        .includes(query)

        ||

        surah.ar
        .includes(query)

        ||

        String(surah.n)
        .includes(query)
    );


    renderSurahs(
        filtered
    );

}



/* =====================================
   DOWNLOAD ONE SURAH
===================================== */

async function downloadSurah(number){

    const url =
    getAudioUrl(number);


    try{

        downloadStatus.innerHTML =
        `Checking Surah ${number}...`;


        /*
         * OPEN CACHE
         */

        const cache =
        await caches.open(
            CACHE_NAME
        );


        /*
         * CHECK WHETHER ALREADY SAVED
         */

        const existing =
        await cache.match(url);


        if(existing){

            downloadStatus.innerHTML =
            `Surah ${number} already saved offline ✓`;

            return;

        }


        /*
         * FETCH AUDIO
         *
         * Explicit CORS request.
         */

        downloadStatus.innerHTML =
        `Downloading Surah ${number}...`;


        const response =
        await fetch(
            url,
            {
                method:"GET",
                mode:"cors",
                cache:"no-store"
            }
        );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        /*
         * SAVE INTO CACHE
         */

        await cache.put(
            url,
            response.clone()
        );


        /*
         * VERIFY CACHE
         */

        const saved =
        await cache.match(url);


        if(!saved){

            throw new Error(
                "Audio was not saved"
            );

        }


        downloadStatus.innerHTML =
        `Surah ${number} saved offline ✓`;


    }catch(error){

        console.log(
            "DOWNLOAD ERROR:",
            error
        );


        downloadStatus.innerHTML =
        `Could not download Surah ${number}`;


        /*
         * FALLBACK:
         * Open audio directly.
         *
         * This confirms the audio
         * source itself is working.
         */

        console.log(
            "Audio URL:",
            url
        );

    }

}



/* =====================================
   DOWNLOAD FULL QURAN
===================================== */

async function downloadFullQuran(){

    const confirmDownload =
    confirm(
        "Download all 114 Surahs for offline listening?"
    );


    if(!confirmDownload) return;


    try{

        const cache =
        await caches.open(
            CACHE_NAME
        );


        let successful =
        0;


        for(
            let i = 1;
            i <= TOTAL_SURAHS;
            i++
        ){

            const url =
            getAudioUrl(i);


            downloadStatus.innerHTML =
            `Downloading ${i} / 114...`;


            try{

                /*
                 * CHECK EXISTING CACHE
                 */

                const existing =
                await cache.match(url);


                if(existing){

                    successful++;

                }else{

                    const response =
                    await fetch(
                        url,
                        {
                            method:"GET",
                            mode:"cors",
                            cache:"no-store"
                        }
                    );


                    if(response.ok){

                        await cache.put(
                            url,
                            response.clone()
                        );

                        successful++;

                    }

                }

            }catch(error){

                console.log(
                    "Failed Surah:",
                    i,
                    error
                );

            }


            const percent =
            (
                i /
                TOTAL_SURAHS
            ) * 100;


            progressBar.style.width =
            percent + "%";

        }


        if(
            successful ===
            TOTAL_SURAHS
        ){

            downloadStatus.innerHTML =
            "Full Quran downloaded ✓";

        }else{

            downloadStatus.innerHTML =
            `${successful} / 114 Surahs saved offline`;

        }


    }catch(error){

        console.log(
            "FULL DOWNLOAD ERROR:",
            error
        );


        downloadStatus.innerHTML =
        "Download error";

    }

}



/* =====================================
   DARK MODE
===================================== */

function toggleDark(){

    document.body.classList.toggle(
        "dark"
    );


    localStorage.setItem(
        "quranDarkMode",
        document.body.classList.contains(
            "dark"
        )
    );

}


if(
    localStorage.getItem(
        "quranDarkMode"
    ) === "true"
){

    document.body.classList.add(
        "dark"
    );

}



/* =====================================
   BACK BUTTON
===================================== */

function goBack(){

    if(
        document.referrer &&
        document.referrer !==
        location.href
    ){

        history.back();

    }else{

        window.location.href =
        "swalath.html";

    }

}



/* =====================================
   MEDIA SESSION
===================================== */

function updateMediaSession(
    surah
){

    if(
        "mediaSession" in navigator
    ){

        navigator.mediaSession.metadata =
        new MediaMetadata({

            title:
            `${surah.en} — ${surah.ar}`,

            artist:
            "Mishary Rashid Alafasy",

            album:
            "Quran MP3 • Swalath"

        });

    }

}


if(
    "mediaSession" in navigator
){

    navigator.mediaSession.setActionHandler(
        "play",
        () => audio.play()
    );


    navigator.mediaSession.setActionHandler(
        "pause",
        () => audio.pause()
    );


    navigator.mediaSession.setActionHandler(
        "previoustrack",
        () => previousSurah()
    );


    navigator.mediaSession.setActionHandler(
        "nexttrack",
        () => nextSurah()
    );

}



/* =====================================
   INITIAL LOAD
===================================== */

renderSurahs();

</script>
