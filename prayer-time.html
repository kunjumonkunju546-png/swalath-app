<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#103b30">
<title>Prayer Times | സ്വലാത്ത്</title>

<style>
:root {
    --bg: #f7f7f2;
    --green: #103b30;
    --green2: #1b5141;
    --gold: #ddc486;
    --text: #25372d;
    --muted: #899087;
    --line: #e7e9e1;
    --row-active: #edf3eb;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

.page {
    width: 100%;
    max-width: 540px;
    min-height: 100vh;
    margin: auto;
    padding: 19px 21px 28px;
}

/* HEADER */

.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 27px;
}

.top-left {
    display: flex;
    align-items: center;
    gap: 13px;
}

.back-btn {
    width: 39px;
    height: 39px;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: transparent;
    color: var(--green);
    font-size: 23px;
    cursor: pointer;
}

.brand-title {
    color: var(--green);
    font-size: 18px;
    font-weight: 700;
}

.brand-subtitle {
    color: var(--muted);
    font-size: 9px;
    letter-spacing: 2px;
    margin-top: 4px;
}

.location {
    color: var(--green);
    font-size: 11px;
    white-space: nowrap;
}

/* PREMIUM HERO */

.hero {
    position: relative;
    overflow: hidden;
    isolation: isolate;
    min-height: 260px;
    padding: 29px 23px 24px;
    border-radius: 24px;
    color: #fff;
    background:
        radial-gradient(
            circle at 95% 5%,
            rgba(221,196,134,.15),
            transparent 32%
        ),
        linear-gradient(145deg, #0b2d24, #164b3a 65%, #205640);
    margin-bottom: 29px;
}

.hero::before {
    content: "☾";
    position: absolute;
    z-index: -1;
    right: 17px;
    top: 2px;
    color: rgba(221,196,134,.10);
    font-size: 105px;
    line-height: 1;
}

.hero-label {
    color: var(--gold);
    font-size: 10px;
    letter-spacing: 2.5px;
    margin-bottom: 15px;
}

.arabic-title {
    font-family: Georgia, serif;
    font-size: 25px;
    margin-bottom: 12px;
    color: #fff;
}

.today-date {
    font-size: 13px;
    color: #e2e9e0;
    line-height: 1.8;
}

.hijri-date {
    font-size: 11px;
    color: var(--gold);
    margin-top: 3px;
}

.hero-divider {
    height: 1px;
    background: rgba(255,255,255,.17);
    margin: 22px 0 17px;
}

.next-label {
    color: var(--gold);
    font-size: 9px;
    letter-spacing: 2px;
    margin-bottom: 9px;
}

.next-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.next-name {
    color: white;
    font-size: 19px;
    font-weight: 700;
}

.next-arabic {
    font-size: 11px;
    color: #d7e1d7;
    margin-top: 5px;
}

.next-time {
    color: var(--gold);
    font-size: 25px;
    font-weight: 700;
    white-space: nowrap;
}

/* PRAYER LIST */

.section-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 0 1px 11px;
}

.section-heading h2 {
    color: var(--green);
    font-size: 17px;
    margin: 0;
}

.section-heading span {
    font-size: 10px;
    color: var(--muted);
}

.prayer-list {
    width: 100%;
}

.prayer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 69px;
    padding: 12px 13px;
    border-bottom: 1px solid var(--line);
    border-radius: 12px;
}

.prayer-row:last-child {
    border-bottom-color: transparent;
}

.prayer-row.next {
    background: var(--row-active);
    border-bottom-color: transparent;
}

.prayer-info {
    display: flex;
    align-items: center;
    gap: 13px;
    min-width: 0;
}

.prayer-indicator {
    width: 3px;
    height: 35px;
    flex-shrink: 0;
    border-radius: 5px;
    background: #d9dfd4;
}

.prayer-row.next .prayer-indicator {
    background: var(--green);
}

.prayer-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
}

.prayer-arabic {
    color: var(--muted);
    font-size: 11px;
    margin-top: 5px;
}

.next-tag {
    color: #47734f;
    font-size: 9px;
    margin-top: 4px;
}

.prayer-time {
    color: var(--green);
    font-size: 16px;
    font-weight: 700;
    white-space: nowrap;
}

.loading,
.error {
    padding: 25px 8px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.8;
}

.retry {
    margin-top: 12px;
    padding: 10px 18px;
    border: 0;
    border-radius: 22px;
    background: var(--green);
    color: white;
    font-size: 12px;
    cursor: pointer;
}

.footer {
    text-align: center;
    padding: 26px 0 5px;
    color: var(--muted);
    font-size: 9px;
    letter-spacing: 1.5px;
}

/* DARK MODE */

body.dark-mode {
    --bg: #111713;
    --green: #d7e6d8;
    --text: #e9eee8;
    --muted: #a6b0a5;
    --line: #343d35;
    --row-active: #25362a;
}

body.dark-mode .back-btn {
    color: var(--green);
    border-color: var(--line);
}

body.dark-mode .brand-title,
body.dark-mode .section-heading h2,
body.dark-mode .prayer-time,
body.dark-mode .location {
    color: var(--green);
}

body.dark-mode .prayer-row.next .prayer-indicator {
    background: #d7e6d8;
}

@media (max-width: 360px) {
    .page {
        padding: 15px 13px 24px;
    }

    .topbar {
        margin-bottom: 21px;
    }

    .hero {
        padding: 25px 18px 21px;
        min-height: 250px;
    }

    .location {
        font-size: 10px;
    }

    .next-time {
        font-size: 22px;
    }

    .prayer-row {
        padding: 11px 9px;
    }

    .prayer-time {
        font-size: 15px;
    }
}
</style>
</head>

<body>
<div class="page">

    <header class="topbar">
        <div class="top-left">
            <button class="back-btn"
                    onclick="goBack()"
                    aria-label="Back">←</button>

            <div>
                <div class="brand-title">സ്വലാത്ത്</div>
                <div class="brand-subtitle">PRAYER TIMES</div>
            </div>
        </div>

        <div class="location">📍 Doha, Qatar</div>
    </header>

    <section class="hero">
        <div class="hero-label">DAILY PRAYER</div>

        <div class="arabic-title">أَوْقَاتُ الصَّلَاة</div>

        <div class="today-date" id="todayDate"></div>
        <div class="hijri-date" id="hijriDate"></div>

        <div class="hero-divider"></div>

        <div class="next-label">UPCOMING PRAYER</div>

        <div class="next-content">
            <div>
                <div class="next-name" id="nextName">
                    സമയം കണ്ടെത്തുന്നു...
                </div>
                <div class="next-arabic" id="nextArabic"></div>
            </div>

            <div class="next-time" id="nextTime">--:--</div>
        </div>
    </section>

    <div class="section-heading">
        <h2>നമസ്കാര സമയങ്ങൾ</h2>
        <span id="updatedDate"></span>
    </div>

    <section class="prayer-list" id="prayerList">
        <div class="loading">
            നമസ്കാര സമയങ്ങൾ ലഭ്യമാക്കുന്നു...
        </div>
    </section>

    <footer class="footer">
        SWALAATH · MADE WITH CARE
    </footer>

</div>

<script>
"use strict";

const API = "https://api.aladhan.com/v1/";

const prayerItems = [
    { key: "Fajr", name: "ഫജ്റ്", ar: "الفجر" },
    { key: "Sunrise", name: "സൂര്യോദയം", ar: "الشروق" },
    { key: "Dhuhr", name: "ളുഹർ", ar: "الظهر" },
    { key: "Asr", name: "അസർ", ar: "العصر" },
    { key: "Maghrib", name: "മഗ്‌രിബ്", ar: "المغرب" },
    { key: "Isha", name: "ഇശാഅ്", ar: "العشاء" }
];

const mainPrayers = prayerItems.filter(
    prayer => prayer.key !== "Sunrise"
);

const currentLocation = {
    city: "Doha",
    country: "Qatar"
};

function dateString(date = new Date()) {
    return date.getFullYear() + "-" +
        String(date.getMonth() + 1).padStart(2, "0") + "-" +
        String(date.getDate()).padStart(2, "0");
}

function updateDates() {
    const now = new Date();

    document.getElementById("todayDate").textContent =
        now.toLocaleDateString("ml-IN", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        });

    document.getElementById("updatedDate").textContent =
        now.toLocaleDateString("en-GB", {
            day: "2-digit",
            month: "short"
        });
}

function parseTime(value) {
    const match = String(value || "").match(/(\d{1,2}):(\d{2})/);

    if (!match) return null;

    return Number(match[1]) * 60 + Number(match[2]);
}

function formatTime(value) {
    const minutes = parseTime(value);

    if (minutes === null) return "--:--";

    const temp = new Date();
    temp.setHours(Math.floor(minutes / 60), minutes % 60, 0, 0);

    return temp.toLocaleTimeString("en-US", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
    });
}

function getNextPrayer(timings) {
    const now = new Date();
    const current = now.getHours() * 60 + now.getMinutes();

    for (const prayer of mainPrayers) {
        const minutes = parseTime(timings[prayer.key]);

        if (minutes !== null && minutes > current) {
            return prayer;
        }
    }

    // If today's prayers have ended, the next prayer is Fajr.
    // The displayed time will be refreshed when tomorrow's
    // schedule is loaded by the next daily app opening.
    return mainPrayers[0];
}

function renderPrayerTimes(data) {
    const timings = data.timings;
    const next = getNextPrayer(timings);

    document.getElementById("nextName").textContent = next.name;
    document.getElementById("nextArabic").textContent = next.ar;
    document.getElementById("nextTime").textContent =
        formatTime(timings[next.key]);

    if (data.date && data.date.hijri) {
        const h = data.date.hijri;

        document.getElementById("hijriDate").textContent =
            h.day + " " + h.month.en + " " + h.year + " AH";
    }

    const list = document.getElementById("prayerList");
    list.innerHTML = "";

    prayerItems.forEach(function(prayer) {
        const row = document.createElement("div");
        row.className = "prayer-row";

        if (prayer.key === next.key) {
            row.classList.add("next");
        }

        const info = document.createElement("div");
        info.className = "prayer-info";

        const indicator = document.createElement("div");
        indicator.className = "prayer-indicator";

        const details = document.createElement("div");

        const name = document.createElement("div");
        name.className = "prayer-name";
        name.textContent = prayer.name;

        const arabic = document.createElement("div");
        arabic.className = "prayer-arabic";
        arabic.textContent = prayer.ar;

        details.appendChild(name);
        details.appendChild(arabic);

        if (prayer.key === next.key) {
            const tag = document.createElement("div");
            tag.className = "next-tag";
            tag.textContent = "അടുത്ത നമസ്കാരം";
            details.appendChild(tag);
        }

        info.appendChild(indicator);
        info.appendChild(details);

        const time = document.createElement("div");
        time.className = "prayer-time";
        time.textContent = formatTime(timings[prayer.key]);

        row.appendChild(info);
        row.appendChild(time);
        list.appendChild(row);
    });
}

async function fetchTimes(url) {
    const list = document.getElementById("prayerList");

    list.innerHTML =
        '<div class="loading">നമസ്കാര സമയങ്ങൾ ലഭ്യമാക്കുന്നു...</div>';

    try {
        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("Network error");
        }

        const result = await response.json();

        if (
            result.code !== 200 ||
            !result.data ||
            !result.data.timings
        ) {
            throw new Error("Prayer times unavailable");
        }

        renderPrayerTimes(result.data);

    } catch (error) {
        list.innerHTML = "";

        const message = document.createElement("div");
        message.className = "error";
        message.textContent =
            "നമസ്കാര സമയങ്ങൾ ഇപ്പോൾ ലഭ്യമല്ല. ഇന്റർനെറ്റ് പരിശോധിച്ച് വീണ്ടും ശ്രമിക്കുക.";

        const retry = document.createElement("button");
        retry.className = "retry";
        retry.textContent = "വീണ്ടും ശ്രമിക്കുക";
        retry.onclick = function() {
            loadCity();
        };

        message.appendChild(document.createElement("br"));
        message.appendChild(retry);
        list.appendChild(message);

        document.getElementById("nextName").textContent =
            "സമയം ലഭ്യമല്ല";

        document.getElementById("nextArabic").textContent = "";
        document.getElementById("nextTime").textContent = "--:--";
    }
}

function loadCity() {
    const url = API + "timingsByCity/" +
        dateString() +
        "?city=" + encodeURIComponent(currentLocation.city) +
        "&country=" + encodeURIComponent(currentLocation.country) +
        "&method=10";

    fetchTimes(url);
}

function goBack() {
    if (
        document.referrer &&
        new URL(document.referrer).origin === location.origin
    ) {
        history.back();
    } else {
        location.href = "./index.html";
    }
}

try {
    if (localStorage.getItem("swalathDarkMode") === "true") {
        document.body.classList.add("dark-mode");
    }
} catch (error) {
    // Continue with the default theme if storage is unavailable.
}

updateDates();
loadCity();
</script>
</body>
</html>
