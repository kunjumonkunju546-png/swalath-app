<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#103b30">
<title>Prayer Times | സ്വലാത്ത്</title>

<style>
:root {
    --bg: #f5f6f1;
    --card: #ffffff;
    --green: #103b30;
    --green-light: #1b5141;
    --gold: #d8bd79;
    --text: #23372e;
    --muted: #879087;
    --line: #e9ece5;
    --highlight: #edf4ec;
}
* { box-sizing: border-box; }

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

.page {
    max-width: 560px;
    min-height: 100vh;
    margin: auto;
    padding: 18px 16px 30px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 23px;
}

.top-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.icon-btn {
    width: 42px;
    height: 42px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--card);
    color: var(--green);
    font-size: 20px;
    cursor: pointer;
}

.brand-title {
    font-size: 18px;
    font-weight: bold;
    color: var(--green);
}

.brand-subtitle {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 1px;
}

.location-chip {
    display: flex;
    align-items: center;
    gap: 5px;
    max-width: 145px;
    color: var(--green);
    font-size: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 10px;
    cursor: pointer;
}

#locationName {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.hero {
    position: relative;
    overflow: hidden;
    padding: 26px 19px 24px;
    text-align: center;
    color: white;
    border-radius: 25px;
    background: linear-gradient(145deg, #0b2e25, #164b3c, #22604b);
    box-shadow: 0 12px 28px rgba(16,59,48,.12);
    margin-bottom: 23px;
}

.hero::before,
.hero::after {
    content: "";
    position: absolute;
    border: 1px solid rgba(216,189,121,.17);
    border-radius: 50%;
    width: 180px;
    height: 180px;
    pointer-events: none;
}

.hero::before {
    top: -120px;
    right: -60px;
}

.hero::after {
    bottom: -140px;
    left: -70px;
}

.hero-label {
    position: relative;
    color: var(--gold);
    font-size: 11px;
    letter-spacing: 2px;
    margin-bottom: 12px;
}

.hero h1 {
    position: relative;
    font-size: 26px;
    margin: 0 0 9px;
    color: #fff;
    font-weight: 600;
}

.hero-date {
    position: relative;
    color: #e0e8df;
    font-size: 13px;
    line-height: 1.7;
}

.hijri-date {
    position: relative;
    color: var(--gold);
    font-size: 12px;
    margin-top: 5px;
}

.next-card {
    position: relative;
    margin-top: 22px;
    padding: 16px;
    text-align: left;
    border-radius: 17px;
    background: rgba(255,255,255,.09);
    border: 1px solid rgba(255,255,255,.13);
}

.next-label {
    color: var(--gold);
    font-size: 11px;
    letter-spacing: 1px;
    margin-bottom: 9px;
}

.next-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.next-name {
    font-size: 18px;
    font-weight: bold;
}

.next-time {
    font-size: 24px;
    font-weight: bold;
    color: var(--gold);
    white-space: nowrap;
}

.section-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 0 2px 13px;
}

.section-heading h2 {
    color: var(--green);
    font-size: 17px;
    margin: 0;
}

.section-heading span {
    font-size: 11px;
    color: var(--muted);
}

.prayer-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 21px;
    padding: 5px 15px;
    box-shadow: 0 5px 20px rgba(24,49,34,.025);
}

.prayer-row {
    min-height: 72px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 12px 10px;
    border-bottom: 1px solid var(--line);
    border-radius: 12px;
}

.prayer-row:last-child {
    border-bottom: none;
}

.prayer-row.next {
    background: var(--highlight);
}

.prayer-info {
    display: flex;
    align-items: center;
    gap: 12px;
}

.prayer-symbol {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 40px;
    height: 40px;
    border-radius: 13px;
    background: #f1f4ed;
    color: var(--green);
    font-size: 18px;
}

.prayer-row.next .prayer-symbol {
    background: var(--green);
    color: white;
}

.prayer-name {
    font-size: 14px;
    font-weight: bold;
    color: var(--text);
}

.prayer-arabic {
    font-size: 11px;
    color: var(--muted);
    margin-top: 5px;
}

.prayer-time {
    color: var(--green);
    font-size: 17px;
    font-weight: bold;
    white-space: nowrap;
}

.next-tag {
    display: inline-block;
    color: #47734f;
    font-size: 10px;
    margin-top: 4px;
}

.loading {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 25px 10px;
    line-height: 1.8;
}

.error {
    text-align: center;
    padding: 20px 10px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.8;
}

.retry {
    margin-top: 10px;
    padding: 9px 16px;
    border: none;
    border-radius: 20px;
    background: var(--green);
    color: white;
    cursor: pointer;
}

.footer {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    padding: 24px 0 8px;
}

body.dark-mode {
    --bg: #111713;
    --card: #202720;
    --green: #d7e6d8;
    --text: #e9eee8;
    --muted: #a6b0a5;
    --line: #374038;
    --highlight: #2b3b2e;
}

body.dark-mode .icon-btn,
body.dark-mode .location-chip {
    background: var(--card);
    color: var(--green);
    border-color: var(--line);
}

body.dark-mode .brand-title,
body.dark-mode .section-heading h2,
body.dark-mode .prayer-time {
    color: var(--green);
}

body.dark-mode .prayer-symbol {
    background: #303b31;
    color: #d7e6d8;
}

body.dark-mode .prayer-row.next .prayer-symbol {
    background: #d7e6d8;
    color: #103b30;
}

@media (max-width: 360px) {
    .page { padding: 13px 11px 25px; }
    .hero { padding: 23px 13px; }
    .hero h1 { font-size: 23px; }
    .next-time { font-size: 21px; }
    .prayer-card { padding: 4px 9px; }
    .prayer-time { font-size: 16px; }
}
</style>
</head>

<body>
<div class="page">

    <header class="topbar">
        <div class="top-left">
            <button class="icon-btn" onclick="goBack()" aria-label="Back">←</button>
            <div>
                <div class="brand-title">സ്വലാത്ത്</div>
                <div class="brand-subtitle">PRAYER TIMES</div>
            </div>
        </div>

        <button class="location-chip" onclick="changeLocation()">
            <span>📍</span>
            <span id="locationName">Doha, Qatar</span>
        </button>
    </header>

    <section class="hero">
        <div class="hero-label">DAILY PRAYER</div>
        <h1>نَمَازُ الْوَقْت</h1>
        <div class="hero-date" id="todayDate"></div>
        <div class="hijri-date" id="hijriDate"></div>

        <div class="next-card">
            <div class="next-label">UPCOMING PRAYER</div>
            <div class="next-content">
                <div class="next-name" id="nextName">സമയം കണ്ടെത്തുന്നു...</div>
                <div class="next-time" id="nextTime">--:--</div>
            </div>
        </div>
    </section>

    <div class="section-heading">
        <h2>നമസ്കാര സമയങ്ങൾ</h2>
        <span id="updatedDate"></span>
    </div>

    <section class="prayer-card" id="prayerList">
        <div class="loading">നമസ്കാര സമയങ്ങൾ ലഭ്യമാക്കുന്നു...</div>
    </section>

    <footer class="footer">
        SWALAATH · Made with care
    </footer>

</div>

<script>
"use strict";

const API = "https://api.aladhan.com/v1/";
const prayerItems = [
    { key: "Fajr", name: "ഫജ്റ്", ar: "الفجر", icon: "🌅" },
    { key: "Sunrise", name: "സൂര്യോദയം", ar: "الشروق", icon: "☀️" },
    { key: "Dhuhr", name: "ളുഹർ", ar: "الظهر", icon: "🌤️" },
    { key: "Asr", name: "അസർ", ar: "العصر", icon: "🌇" },
    { key: "Maghrib", name: "മഗ്‌രിബ്", ar: "المغرب", icon: "🌆" },
    { key: "Isha", name: "ഇശാഅ്", ar: "العشاء", icon: "🌙" }
];

let currentLocation = {
    city: "Doha",
    country: "Qatar"
};

function dateString(date = new Date()) {
    return date.getFullYear() + "-" +
        String(date.getMonth() + 1).padStart(2, "0") + "-" +
        String(date.getDate()).padStart(2, "0");
}

function updateDates() {
    const now = new Date();

    document.getElementById("todayDate").textContent =
        now.toLocaleDateString("ml-IN", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        });

    document.getElementById("updatedDate").textContent =
        now.toLocaleDateString("en-GB", {
            day: "2-digit",
            month: "short"
        });
}

function parseTime(value) {
    const match = String(value || "").match(/(\d{1,2}):(\d{2})/);
    if (!match) return null;

    return Number(match[1]) * 60 + Number(match[2]);
}

function formatTime(value) {
    const minutes = parseTime(value);
    if (minutes === null) return "--:--";

    const h = Math.floor(minutes / 60);
    const m = minutes % 60;

    const temp = new Date();
    temp.setHours(h, m, 0, 0);

    return temp.toLocaleTimeString("en-US", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
    });
}

function getNextPrayer(timings) {
    const now = new Date();
    const current = now.getHours() * 60 + now.getMinutes();

    const main = prayerItems.filter(
        p => p.key !== "Sunrise"
    );

    for (const p of main) {
        const minutes = parseTime(timings[p.key]);

        if (minutes !== null && minutes > current) {
            return p;
        }
    }

    return main[0];
}

function renderPrayerTimes(data) {
    const timings = data.timings;
    const next = getNextPrayer(timings);

    document.getElementById("nextName").textContent =
        next.name + " · " + next.ar;

    document.getElementById("nextTime").textContent =
        formatTime(timings[next.key]);

    if (data.date && data.date.hijri) {
        const h = data.date.hijri;
        document.getElementById("hijriDate").textContent =
            h.day + " " + h.month.en + " " + h.year + " AH";
    }

    const list = document.getElementById("prayerList");
    list.innerHTML = "";

    prayerItems.forEach(function(p) {
        const row = document.createElement("div");
        row.className = "prayer-row";

        if (p.key === next.key) {
            row.classList.add("next");
        }

        const info = document.createElement("div");
        info.className = "prayer-info";

        const symbol = document.createElement("div");
        symbol.className = "prayer-symbol";
        symbol.textContent = p.icon;

        const details = document.createElement("div");

        const name = document.createElement("div");
        name.className = "prayer-name";
        name.textContent = p.name;

        const arabic = document.createElement("div");
        arabic.className = "prayer-arabic";
        arabic.textContent = p.ar;

        details.appendChild(name);
        details.appendChild(arabic);

        if (p.key === next.key) {
            const tag = document.createElement("div");
            tag.className = "next-tag";
            tag.textContent = "അടുത്ത നമസ്കാരം";
            details.appendChild(tag);
        }

        info.appendChild(symbol);
        info.appendChild(details);

        const time = document.createElement("div");
        time.className = "prayer-time";
        time.textContent = formatTime(timings[p.key]);

        row.appendChild(info);
        row.appendChild(time);
        list.appendChild(row);
    });
}

async function fetchTimes(url) {
    const list = document.getElementById("prayerList");
    list.innerHTML =
        '<div class="loading">നമസ്കാര സമയങ്ങൾ ലഭ്യമാക്കുന്നു...</div>';

    try {
        const response = await fetch(url);

        if (!response.ok) throw new Error("Network error");

        const result = await response.json();

        if (result.code !== 200 ||
            !result.data ||
            !result.data.timings) {
            throw new Error("Prayer times unavailable");
        }

        renderPrayerTimes(result.data);
    } catch (error) {
        list.innerHTML = "";

        const box = document.createElement("div");
        box.className = "error";
        box.textContent =
            "നമസ്കാര സമയങ്ങൾ ഇപ്പോൾ ലഭ്യമല്ല. ഇന്റർനെറ്റ് പരിശോധിച്ച് വീണ്ടും ശ്രമിക്കുക.";

        const button = document.createElement("button");
        button.className = "retry";
        button.textContent = "വീണ്ടും ശ്രമിക്കുക";
        button.onclick = function() {
            loadCity(currentLocation.city, currentLocation.country);
        };

        box.appendChild(document.createElement("br"));
        box.appendChild(button);
        list.appendChild(box);

        document.getElementById("nextName").textContent =
            "സമയം ലഭ്യമല്ല";

        document.getElementById("nextTime").textContent = "--:--";
    }
}

function loadCity(city, country) {
    currentLocation = { city, country };

    document.getElementById("locationName").textContent =
        city + ", " + country;

    const url = API + "timingsByCity/" +
        encodeURIComponent(dateString()) +
        "?city=" + encodeURIComponent(city) +
        "&country=" + encodeURIComponent(country) +
        "&method=10";

    fetchTimes(url);
}

function changeLocation() {
    const city = prompt("നിങ്ങളുടെ നഗരം നൽകുക:", currentLocation.city);
    if (city === null || !city.trim()) return;

    const country = prompt(
        "രാജ്യം നൽകുക:",
        currentLocation.country
    );
    if (country === null || !country.trim()) return;

    loadCity(city.trim(), country.trim());
}

function goBack() {
    if (document.referrer &&
        new URL(document.referrer).origin === location.origin) {
        history.back();
    } else {
        location.href = "./index.html";
    }
}

if (localStorage.getItem("swalathDarkMode") === "true") {
    document.body.classList.add("dark-mode");
}

updateDates();
loadCity("Doha", "Qatar");
</script>
</body>
</html>
