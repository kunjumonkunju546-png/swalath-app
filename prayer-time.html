<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#103b30">
<title>Prayer Times | സ്വലാത്ത്</title>

<link rel="stylesheet" href="share-card.css">
<script src="share-card.js" defer></script>
<script src="language.js"></script>

<style>
:root {
    --bg:#f7f7f2;
    --green:#103b30;
    --green2:#1b5141;
    --gold:#ddc486;
    --text:#25372d;
    --muted:#899087;
    --line:#e7e9e1;
    --active:#edf3eb;
}
* { box-sizing:border-box; }

body {
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
}
.page {
    width:100%;
    max-width:540px;
    min-height:100vh;
    margin:auto;
    padding:19px 21px 28px;
}
.topbar {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:20px;
}
.top-left {
    display:flex;
    align-items:center;
    gap:12px;
}
.back-btn {
    width:39px;
    height:39px;
    border:1px solid var(--line);
    border-radius:50%;
    background:transparent;
    color:var(--green);
    font-size:23px;
    cursor:pointer;
}
.brand-title {
    color:var(--green);
    font-size:18px;
    font-weight:700;
}
.brand-subtitle {
    color:var(--muted);
    font-size:9px;
    letter-spacing:2px;
    margin-top:4px;
}
.location-chip {
    max-width:155px;
    border:0;
    background:transparent;
    color:var(--green);
    display:flex;
    align-items:center;
    gap:6px;
    font-size:11px;
    text-align:right;
    cursor:pointer;
}
#locationName {
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

/* OFFLINE BANNER */
.offline-banner {
    background: #e67e22;
    color: white;
    text-align: center;
    font-size: 11px;
    padding: 6px;
    border-radius: 8px;
    margin-bottom: 15px;
    display: none;
    font-weight: bold;
}

.hero {
    position:relative;
    overflow:hidden;
    isolation:isolate;
    padding:27px 22px 23px;
    min-height:250px;
    border-radius:24px;
    color:white;
    background:
        radial-gradient(circle at 95% 5%,
        rgba(221,196,134,.15),transparent 32%),
        linear-gradient(145deg,#0b2d24,#164b3a 65%,#205640);
    margin-bottom:25px;
}
.hero::before {
    content:"☾";
    position:absolute;
    z-index:-1;
    right:14px;
    top:0;
    color:rgba(221,196,134,.11);
    font-size:105px;
    line-height:1;
}
.hero-label {
    color:var(--gold);
    font-size:10px;
    letter-spacing:2.5px;
    margin-bottom:15px;
}
.arabic-title {
    font-family:Georgia,serif;
    font-size:25px;
    margin-bottom:12px;
}
.today-date {
    font-size:13px;
    color:#e2e9e0;
    line-height:1.8;
}
.hijri-date {
    font-size:11px;
    color:var(--gold);
    margin-top:3px;
}
.hero-divider {
    height:1px;
    background:rgba(255,255,255,.17);
    margin:21px 0 17px;
}
.next-label {
    color:var(--gold);
    font-size:9px;
    letter-spacing:2px;
    margin-bottom:9px;
}
.next-content {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}
.next-name {
    font-size:19px;
    font-weight:700;
}
.next-arabic {
    font-size:11px;
    color:#d7e1d7;
    margin-top:5px;
}
.next-time {
    color:var(--gold);
    font-size:25px;
    font-weight:700;
    white-space:nowrap;
}

/* COMPACT PREMIUM ADHAN CONTROL PANEL */
.adhan-control-card {
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 16px 18px;
    margin-top: 25px;
    margin-bottom: 25px;
    box-shadow: 0 4px 15px rgba(16,59,48,0.04);
}
.adhan-control-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}
.adhan-control-header h3 {
    color: var(--green);
    font-size: 14px;
    font-weight: 700;
    margin: 0;
}
.master-mute-btn {
    background: #103b30;
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
}
.adhan-toggles {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
}
.adhan-toggle-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-family: Georgia, serif;
    background: #fcfcf9;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    color: var(--green);
    font-weight: bold;
}
.adhan-toggle-item input {
    cursor: pointer;
    width: 16px;
    height: 16px;
    accent-color: var(--green);
}

.section-heading {
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:0 1px 11px;
}
.section-heading h2 {
    color:var(--green);
    font-size:17px;
    margin:0;
}
.section-heading span {
    font-size:10px;
    color:var(--muted);
}
.prayer-row {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    min-height:69px;
    padding:12px 13px;
    border-bottom:1px solid var(--line);
    border-radius:12px;
}
.prayer-row:last-child { border-bottom-color:transparent; }
.prayer-row.next { background:var(--active); }
.prayer-info {
    display:flex;
    align-items:center;
    gap:13px;
    min-width:0;
}
.prayer-indicator {
    width:3px;
    height:35px;
    flex-shrink:0;
    border-radius:5px;
    background:#d9dfd4;
}
.prayer-row.next .prayer-indicator { background:var(--green); }
.prayer-name {
    font-size:14px;
    font-weight:700;
}
.prayer-arabic {
    color:var(--muted);
    font-size:11px;
    margin-top:5px;
}
.next-tag {
    color:#47734f;
    font-size:9px;
    margin-top:4px;
}
.prayer-time {
    color:var(--green);
    font-size:16px;
    font-weight:700;
    white-space:nowrap;
}
.status {
    text-align:center;
    padding:28px 15px;
    color:var(--muted);
    font-size:13px;
    line-height:1.9;
}
.status-icon {
    font-size:29px;
    margin-bottom:8px;
}
.action-btn {
    display:inline-block;
    margin:9px 4px 0;
    padding:11px 18px;
    border:0;
    border-radius:22px;
    background:var(--green);
    color:white;
    font-size:12px;
    cursor:pointer;
}
.action-btn.secondary {
    color:var(--green);
    background:#e8eee6;
}
.footer {
    text-align:center;
    padding:26px 0 5px;
    color:var(--muted);
    font-size:9px;
    letter-spacing:1.5px;
}

body.dark-mode {
    --bg:#111713;
    --green:#d7e6d8;
    --text:#e9eee8;
    --muted:#a6b0a5;
    --line:#343d35;
    --active:#25362a;
}
body.dark-mode .back-btn {
    color:var(--green);
    border-color:var(--line);
}
body.dark-mode .brand-title,
body.dark-mode .section-heading h2,
body.dark-mode .prayer-time,
body.dark-mode .location-chip,
body.dark-mode .adhan-control-header h3 {
    color:var(--green);
}
body.dark-mode .prayer-row.next .prayer-indicator {
    background:#d7e6d8;
}
body.dark-mode .adhan-control-card, body.dark-mode .adhan-toggle-item {
    background: #19251f;
    border-color: #32463b;
    color: #e9eee8;
}

@media(max-width:360px) {
    .page { padding:15px 13px 24px; }
    .hero { padding:24px 17px 21px; }
    .next-time { font-size:22px; }
    .prayer-row { padding:11px 9px; }
    .prayer-time { font-size:15px; }
    .adhan-toggles { grid-template-columns: 1fr; }
}
</style>
</head>

<body>
<div class="page">

<header class="topbar">
    <div class="top-left">
        <button class="back-btn" onclick="goBack()" aria-label="Back">←</button>
        <div>
            <div class="brand-title">സ്വലാത്ത്</div>
            <div class="brand-subtitle">PRAYER TIMES</div>
        </div>
    </div>

    <button class="location-chip" onclick="startLocation()" aria-label="Refresh location">
        <span>📍</span>
        <span id="locationName">സ്ഥലം കണ്ടെത്തുന്നു...</span>
    </button>
</header>

<!-- OFFLINE ALERT BANNER -->
<div id="offlineBanner" class="offline-banner">⚠️ You are offline. Showing saved prayer times.</div>

<section class="hero">
    <div class="hero-label">DAILY PRAYER</div>
    <div class="arabic-title">أَوْقَاتُ الصَّلَاة</div>
    <div class="today-date" id="todayDate"></div>
    <div class="hijri-date" id="hijriDate"></div>

    <div class="hero-divider"></div>

    <div class="next-label">UPCOMING PRAYER</div>
    <div class="next-content">
        <div>
            <div class="next-name" id="nextName">സമയം കണ്ടെത്തുന്നു...</div>
            <div class="next-arabic" id="nextArabic"></div>
        </div>
        <div class="next-time" id="nextTime">--:--</div>
    </div>
</section>

<div class="section-heading">
    <h2 data-i18n="prayerTimesTitle">നമസ്കാര സമയങ്ങൾ</h2>
    <span id="updatedDate"></span>
</div>

<section id="prayerList">
    <div class="status">നിങ്ങളുടെ സ്ഥലം കണ്ടെത്തുന്നു...</div>
</section>

<!-- ADHAN CONTROL & QUICK MUTE PANEL -->
<section class="adhan-control-card">
    <div class="adhan-control-header">
        <h3>🕌 Adhan Sound Settings</h3>
        <button id="masterMuteBtn" class="master-mute-btn" onclick="toggleMasterMute()">🔔 Adhan ON</button>
    </div>
    <div class="adhan-toggles">
        <label class="adhan-toggle-item">
            <span>الفجر (Fajr)</span>
            <input type="checkbox" id="fajrAdhan" checked onchange="savePrayerPreference('Fajr')">
        </label>
        <label class="adhan-toggle-item">
            <span>الظهر (Dhuhr)</span>
            <input type="checkbox" id="dhuhrAdhan" checked onchange="savePrayerPreference('Dhuhr')">
        </label>
        <label class="adhan-toggle-item">
            <span>العصر (Asr)</span>
            <input type="checkbox" id="asrAdhan" checked onchange="savePrayerPreference('Asr')">
        </label>
        <label class="adhan-toggle-item">
            <span>المغرب (Maghrib)</span>
            <input type="checkbox" id="maghribAdhan" checked onchange="savePrayerPreference('Maghrib')">
        </label>
        <label class="adhan-toggle-item" style="grid-column: span 2;">
            <span>العشاء (Isha)</span>
            <input type="checkbox" id="ishaAdhan" checked onchange="savePrayerPreference('Isha')">
        </label>
    </div>
</section>

<section id="locationStatus" class="status" hidden></section>

<footer class="footer">SWALAATH · MADE WITH CARE</footer>
</div>

<!-- AUDIO PLAYER FOR ADHAN -->
<audio id="adhanAudio" preload="auto">
    <source src="https://islamic-api.com/audio/adhan.mp3" type="audio/mpeg">
    <source src="https://cdn.islamic.network/quran/audio/128/ar.alafasy/1.mp3" type="audio/mpeg">
</audio>

<script>
"use strict";

const API = "https://api.aladhan.com/v1/";
const CACHE_KEY = "swalathPrayerLocation";
const CACHE_TIME_KEY = "swalathPrayerLocationTime";
const CACHE_TIMINGS_KEY = "swalathCachedTimings";

const prayerItems = [
    {key:"Fajr",nameKey:"fajr",ar:"الفجر"},
    {key:"Sunrise",nameKey:"sunrise",ar:"الشروق"},
    {key:"Dhuhr",nameKey:"dhuhr",ar:"الظهر"},
    {key:"Asr",nameKey:"asr",ar:"العصر"},
    {key:"Maghrib",nameKey:"maghrib",ar:"المغرب"},
    {key:"Isha",nameKey:"isha",ar:"العشاء"}
];

const mainPrayers = prayerItems.filter(p => p.key !== "Sunrise");

let coordinates = null;
let locationRequestInProgress = false;
let lastPrayerData = null;
let lastPlayedMinuteKey = "";

// Check online/offline status
function checkNetworkStatus() {
    const banner = document.getElementById("offlineBanner");
    if (!navigator.onLine) {
        if (banner) banner.style.display = "block";
    } else {
        if (banner) banner.style.display = "none";
    }
}
window.addEventListener("online", checkNetworkStatus);
window.addEventListener("offline", checkNetworkStatus);

function toggleMasterMute() {
    let isMuted = localStorage.getItem("swalathMasterMute") === "true";
    isMuted = !isMuted;
    localStorage.setItem("swalathMasterMute", String(isMuted));
    updateMasterMuteButton();
}

function updateMasterMuteButton() {
    const btn = document.getElementById("masterMuteBtn");
    if (!btn) return;
    const isMuted = localStorage.getItem("swalathMasterMute") === "true";
    if (isMuted) {
        btn.textContent = "🔕 Muted";
        btn.style.background = "#c0392b";
    } else {
        btn.textContent = "🔔 Adhan ON";
        btn.style.background = "#103b30";
    }
}

function savePrayerPreference(prayerKey) {
    const mapKey = prayerKey.toLowerCase();
    const checkbox = document.getElementById(mapKey + "Adhan");
    if (checkbox) {
        localStorage.setItem("prayer_adhan_" + prayerKey, String(checkbox.checked));
    }
}

function loadPreferences() {
    updateMasterMuteButton();
    ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'].forEach(function(p) {
        const saved = localStorage.getItem("prayer_adhan_" + p);
        const checkbox = document.getElementById(p.toLowerCase() + "Adhan");
        if (checkbox && saved !== null) {
            checkbox.checked = saved === "true";
        }
    });
}

function getPrayerName(prayer) {
    if (window.SwalathLanguage && typeof window.SwalathLanguage.t === "function") {
        return window.SwalathLanguage.t(prayer.nameKey);
    }
    return prayer.nameKey;
}

function dateString(date = new Date()) {
    return date.getFullYear() + "-" +
        String(date.getMonth()+1).padStart(2,"0") + "-" +
        String(date.getDate()).padStart(2,"0");
}

function updateDates() {
    const now = new Date();
    const currentLang = window.SwalathLanguage && typeof window.SwalathLanguage.getCurrent === "function" 
        ? window.SwalathLanguage.getCurrent() : "ml";

    let locale = "ml-IN";
    if (currentLang === "en") locale = "en-GB";
    else if (currentLang === "ar") locale = "ar-SA";
    else if (currentLang === "hi") locale = "hi-IN";
    else if (currentLang === "ur") locale = "ur-PK";
    else if (currentLang === "ta") locale = "ta-IN";

    try {
        document.getElementById("todayDate").textContent =
            now.toLocaleDateString(locale, {
                weekday:"long",day:"numeric",month:"long",year:"numeric"
            });
    } catch(e) {
        document.getElementById("todayDate").textContent = now.toDateString();
    }

    document.getElementById("updatedDate").textContent =
        now.toLocaleDateString("en-GB", {day:"2-digit",month:"short"});
}

function parseTime(value) {
    const match = String(value || "").match(/(\d{1,2}):(\d{2})/);
    if (!match) return null;
    return Number(match[1])*60 + Number(match[2]);
}

function formatTime(value) {
    const minutes = parseTime(value);
    if (minutes === null) return "--:--";

    const date = new Date();
    date.setHours(Math.floor(minutes/60),minutes%60,0,0);

    return date.toLocaleTimeString("en-US", {
        hour:"2-digit",minute:"2-digit",hour12:true
    });
}

function getNextPrayer(timings) {
    const now = new Date();
    const current = now.getHours()*60 + now.getMinutes();

    for (const prayer of mainPrayers) {
        const minutes = parseTime(timings[prayer.key]);
        if (minutes !== null && minutes > current) return prayer;
    }

    return mainPrayers[0];
}

function checkAdhanTime(timings) {
    const isMasterMuted = localStorage.getItem("swalathMasterMute") === "true";
    if (isMasterMuted) return;

    const now = new Date();
    const currentHour = now.getHours();
    const currentMinute = now.getMinutes();
    const currentMinuteKey = dateString() + "_" + currentHour + "_" + currentMinute;

    if (lastPlayedMinuteKey === currentMinuteKey) return;

    mainPrayers.forEach(prayer => {
        const timeStr = timings[prayer.key];
        const pMinutes = parseTime(timeStr);
        if (pMinutes === null) return;

        const prayerHour = Math.floor(pMinutes / 60);
        const prayerMin = pMinutes % 60;

        if (currentHour === prayerHour && currentMinute === prayerMin) {
            const isEnabled = localStorage.getItem("prayer_adhan_" + prayer.key);
            if (isEnabled === "false") return;

            lastPlayedMinuteKey = currentMinuteKey;
            playAdhanAudio();
        }
    });
}

function playAdhanAudio() {
    const audio = document.getElementById("adhanAudio");
    if (audio) {
        audio.currentTime = 0;
        audio.play().catch(err => {
            console.log("Audio autoplay restricted:", err);
        });
    }
}

function renderPrayerTimes(data) {
    lastPrayerData = data;
    const timings = data.timings;
    const next = getNextPrayer(timings);

    document.getElementById("nextName").textContent = getPrayerName(next);
    document.getElementById("nextArabic").textContent = next.ar;
    document.getElementById("nextTime").textContent =
        formatTime(timings[next.key]);

    if (data.date && data.date.hijri) {
        const h = data.date.hijri;
        document.getElementById("hijriDate").textContent =
            h.day + " " + h.month.en + " " + h.year + " AH";
    }

    const list = document.getElementById("prayerList");
    list.innerHTML = "";

    prayerItems.forEach(prayer => {
        const row = document.createElement("div");
        row.className = "prayer-row";

        if (prayer.key === next.key) row.classList.add("next");

        const info = document.createElement("div");
        info.className = "prayer-info";

        const indicator = document.createElement("div");
        indicator.className = "prayer-indicator";

        const details = document.createElement("div");

        const name = document.createElement("div");
        name.className = "prayer-name";
        name.textContent = getPrayerName(prayer);

        const arabic = document.createElement("div");
        arabic.className = "prayer-arabic";
        arabic.textContent = prayer.ar;

        details.append(name,arabic);

        if (prayer.key === next.key) {
            const tag = document.createElement("div");
            tag.className = "next-tag";
            tag.textContent = window.SwalathLanguage && window.SwalathLanguage.getCurrent() === "ar" ? "الصلاة القادمة" : "അടുത്ത നമസ്കാരം";
            details.appendChild(tag);
        }

        info.append(indicator,details);

        const time = document.createElement("div");
        time.className = "prayer-time";
        time.textContent = formatTime(timings[prayer.key]);

        row.append(info,time);
        list.appendChild(row);
    });

    checkAdhanTime(timings);
}

function showLocationStatus(message, actions = []) {
    const box = document.getElementById("locationStatus");
    box.hidden = false;
    box.innerHTML = "";

    const icon = document.createElement("div");
    icon.className = "status-icon";
    icon.textContent = "📍";
    box.appendChild(icon);

    const text = document.createElement("div");
    text.textContent = message;
    box.appendChild(text);

    actions.forEach(action => {
        const button = document.createElement("button");
        button.className = "action-btn" + (action.secondary ? " secondary" : "");
        button.textContent = action.label;
        button.onclick = action.onClick;
        box.appendChild(button);
    });
}

function hideLocationStatus() {
    document.getElementById("locationStatus").hidden = true;
}

function showPrayerLoading(message) {
    document.getElementById("prayerList").innerHTML =
        '<div class="status">' + message + '</div>';
}

function loadCachedCoordinates() {
    try {
        const saved = localStorage.getItem(CACHE_KEY);
        if (!saved) return null;
        const parsed = JSON.parse(saved);
        if (typeof parsed.lat !== "number" || typeof parsed.lon !== "number") return null;
        return parsed;
    } catch (e) {
        return null;
    }
}

function saveCoordinates(lat, lon) {
    try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({lat,lon}));
        localStorage.setItem(CACHE_TIME_KEY, String(Date.now()));
    } catch (e) {}
}

async function fetchPrayerTimes(lat, lon) {
    showPrayerLoading("നിങ്ങളുടെ സ്ഥലത്തെ നമസ്കാര സമയം ലഭ്യമാക്കുന്നു...");

    const url = API + "timings/" + dateString() +
        "?latitude=" + encodeURIComponent(lat) +
        "&longitude=" + encodeURIComponent(lon) +
        "&method=10";

    try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("Network error");

        const result = await response.json();
        if (result.code !== 200 || !result.data || !result.data.timings) {
            throw new Error("Prayer times unavailable");
        }

        // Cache successful timings for offline use
        localStorage.setItem(CACHE_TIMINGS_KEY, JSON.stringify(result.data));

        renderPrayerTimes(result.data);
        hideLocationStatus();

    } catch (error) {
        // Fallback to cached timings if offline or error
        const cachedTimings = localStorage.getItem(CACHE_TIMINGS_KEY);
        if (cachedTimings) {
            try {
                const parsedData = JSON.parse(cachedTimings);
                renderPrayerTimes(parsedData);
                document.getElementById("offlineBanner").style.display = "block";
                hideLocationStatus();
                return;
            } catch(e) {}
        }

        showPrayerLoading("നമസ്കാര സമയങ്ങൾ ലഭ്യമാക്കാൻ കഴിഞ്ഞില്ല. ഇന്റർനെറ്റ് പരിശോധിക്കുക.");
        showLocationStatus("സമയങ്ങൾ ലഭ്യമല്ല.", [{label:"വീണ്ടും ശ്രമിക്കുക", onClick:() => fetchPrayerTimes(lat, lon)}]);
    }
}

function startLocation() {
    if (locationRequestInProgress) return;

    if (!window.isSecureContext || !("geolocation" in navigator)) {
        showLocationStatus("Location സൗകര്യം ലഭ്യമല്ല.");
        return;
    }

    locationRequestInProgress = true;
    hideLocationStatus();
    document.getElementById("locationName").textContent = "സ്ഥലം കണ്ടെത്തുന്നു...";

    navigator.geolocation.getCurrentPosition(
        async position => {
            locationRequestInProgress = false;
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            coordinates = {lat,lon};
            saveCoordinates(lat,lon);
            await fetchPrayerTimes(lat,lon);
            lookupCityName(lat,lon);
        },
        error => {
            locationRequestInProgress = false;
            showLocationStatus(
                "Location അനുമതി ലഭിച്ചില്ല. ഫോണിന്റെ Settings-ൽ Location അനുവദിച്ച് വീണ്ടും ശ്രമിക്കുക.",
                [{label:"വീണ്ടും ശ്രമിക്കുക", onClick:startLocation}]
            );
        },
        { enableHighAccuracy: false, timeout: 15000, maximumAge: 300000 }
    );
}

async function lookupCityName(lat, lon) {
    try {
        const url = "https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=" + lat + "&lon=" + lon;
        const response = await fetch(url);
        if (!response.ok) return;
        const data = await response.json();
        const address = data.address || {};
        const city = address.city || address.town || address.village || address.state;
        const country = address.country;
        if (city && country) {
            document.getElementById("locationName").textContent = city + ", " + country;
        }
    } catch (e) {}
}

function goBack() {
    if (document.referrer && new URL(document.referrer).origin === location.origin) {
        history.back();
        return;
    }
    location.href = "./index.html";
}

document.addEventListener("swalath-language-changed", function() {
    updateDates();
    if (lastPrayerData) renderPrayerTimes(lastPrayerData);
});

// System Theme Sync & Saved Dark Mode Check
try {
    const savedDark = localStorage.getItem("swalathDarkMode");
    if (savedDark === "true" || (savedDark === null && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.body.classList.add("dark-mode");
    }
} catch (e) {}

checkNetworkStatus();
loadPreferences();
updateDates();

const cached = loadCachedCoordinates();
if (cached) {
    coordinates = cached;
    document.getElementById("locationName").textContent = "നിങ്ങളുടെ സ്ഥലം";
    
    // Load offline cached timings instantly if available
    const cachedTimings = localStorage.getItem(CACHE_TIMINGS_KEY);
    if (cachedTimings) {
        try {
            renderPrayerTimes(JSON.parse(cachedTimings));
        } catch(e) {}
    }
    
    fetchPrayerTimes(cached.lat, cached.lon);
} else {
    showPrayerLoading("നിങ്ങളുടെ സ്ഥലം കണ്ടെത്തുന്നു...");
    startLocation();
}

setInterval(() => {
    if (lastPrayerData && lastPrayerData.timings) {
        checkAdhanTime(lastPrayerData.timings);
    }
}, 30000);
</script>
