<!-- PREMIUM HIJRI CALENDAR & SPECIAL DAYS CARD -->
<div class="khatam-card" id="hijriCard" style="background: linear-gradient(135deg, #ffffff 0%, #f7f9f6 100%); border: 2px solid #ddc486; border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 6px 20px rgba(18,61,52,0.08); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
    
    <!-- Header -->
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; border-bottom: 1px solid #e6dfd0; padding-bottom: 10px;">
        <h3 id="hijriCardTitle" style="color: #123d34; font-size: 17px; margin: 0; font-weight: 700;">🗓️ ഹിജ്‌റ കലണ്ടറും വിശേഷ ദിവസങ്ങളും</h3>
        <span style="background: #123d34; color: #ddc486; font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: bold;" id="hijriBadge">Islamic Calendar</span>
    </div>

    <!-- Date Display Box -->
    <div class="target-box" style="background: #edf3eb; border: 1.5px solid #123d34; border-radius: 14px; padding: 14px; text-align: center; margin-bottom: 15px; box-shadow: inset 0 2px 5px rgba(18,61,52,0.03);">
        <h4 id="hijriDateLabel" style="color: #123d34; margin: 0 0 6px 0; font-size: 13px; font-weight: 600;">ഇന്നത്തെ ഹിജ്‌റ & ഇംഗ്ലീഷ് തീയതി:</h4>
        <p id="currentHijriText" style="font-size: 15px; color: #123d34; margin: 0 0 4px 0; font-weight: bold;">ലോഡ് ചെയ്യുന്നു...</p>
        <p id="currentEnglishText" style="font-size: 12px; color: #555; margin: 0; font-weight: 500;">Loading...</p>
    </div>

    <!-- Special Days Section -->
    <div style="font-size: 13px;">
        <strong id="specialDaysHeading" style="color: #123d34; display: block; margin-bottom: 8px; font-weight: 600;">പ്രധാനപ്പെട്ട വിശേഷ ദിനങ്ങൾ (Special Days):</strong>
        <div style="background: #fffdf8; padding: 12px; border-radius: 12px; border: 1.5px dashed #ddc486; line-height: 1.7; color: #333;">
            <p id="ev1" style="margin: 6px 0; display: flex; align-items: center; gap: 6px;">🌙 <span style="font-weight: 600;">റമദാൻ 1:</span> വരാനിരിക്കുന്നു</p>
            <p id="ev2" style="margin: 6px 0; display: flex; align-items: center; gap: 6px;">🕋 <span style="font-weight: 600;">അറഫാ ദിനം:</span> ദുൽഹിജ്ജ 9</p>
            <p id="ev3" style="margin: 6px 0; display: flex; align-items: center; gap: 6px;">🎉 <span style="font-weight: 600;">പെരുന്നാൾ:</span> ശവ്വാൽ 1</p>
        </div>
    </div>
</div>

<script>
// Dynamic Date & Multilingual Support for Hijri Card
function applyHijriCardLanguage() {
    const currentLang = window.SwalathLanguage && typeof window.SwalathLanguage.getCurrent === "function" 
        ? window.SwalathLanguage.getCurrent() 
        : (localStorage.getItem('swalath_lang') || 'ml');
    
    const today = new Date();
    
    // Auto generate English Date
    const engOptions = { year: 'numeric', month: 'long', day: 'numeric' };
    const engLocale = currentLang === 'ar' ? 'ar-SA' : (currentLang === 'en' ? 'en-US' : 'ml-IN');
    const engDateStr = today.toLocaleDateString(engLocale, engOptions);
    
    const engTextEl = document.getElementById('currentEnglishText');
    if (engTextEl) {
        engTextEl.textContent = engDateStr;
    }

    // Auto generate Hijri Date dynamically using browser locale
    try {
        const hijriFormatter = new Intl.DateTimeFormat(currentLang === 'ar' ? 'ar-SA-u-ca-islamic' : (currentLang === 'en' ? 'en-US-u-ca-islamic' : 'ar-SA-u-ca-islamic-umalqura'), {
            day: 'numeric',
            month: 'long',
            year: 'numeric'
        });
        const hijriDateStr = hijriFormatter.format(today);
        const hijriTextEl = document.getElementById('currentHijriText');
        if (hijriTextEl) {
            hijriTextEl.textContent = hijriDateStr;
        }
    } catch (e) {
        document.getElementById('currentHijriText').textContent = "1448 ഹിജ്‌റ";
    }

    // Multilingual text labels update
    if (currentLang === "en") {
        document.getElementById('hijriCardTitle').textContent = "🗓️ Hijri Calendar & Special Days";
        document.getElementById('hijriDateLabel').textContent = "Today's Hijri & English Date:";
        document.getElementById('specialDaysHeading').textContent = "Upcoming Special Days:";
        document.getElementById('hijriBadge').textContent = "Islamic Calendar";
        document.getElementById('ev1').innerHTML = "🌙 <b>Ramadan 1:</b> Upcoming";
        document.getElementById('ev2').innerHTML = "🕋 <b>Day of Arafah:</b> Dhul-Hijjah 9";
        document.getElementById('ev3').innerHTML = "🎉 <b>Eid Al-Fitr:</b> Shawwal 1";
    } else if (currentLang === "ar") {
        document.getElementById('hijriCardTitle').textContent = "🗓️ التقويم الهجري والأيام المباركة";
        document.getElementById('hijriDateLabel').textContent = "التاريخ الهجري والميلادي اليوم:";
        document.getElementById('specialDaysHeading').textContent = "الأيام المميزة القادمة:";
        document.getElementById('hijriBadge').textContent = "التقويم الإسلامي";
        document.getElementById('ev1').innerHTML = "🌙 <b>رمضان ١:</b> قريباً إن شاء الله";
        document.getElementById('ev2').innerHTML = "🕋 <b>يوم عرفة:</b> ٩ ذو الحجة";
        document.getElementById('ev3').innerHTML = "🎉 <b>عيد الفطر:</b> ١ شوال";
    } else {
        document.getElementById('hijriCardTitle').textContent = "🗓️ ഹിജ്‌റ കലണ്ടറും വിശേഷ ദിവസങ്ങളും";
        document.getElementById('hijriDateLabel').textContent = "ഇന്നത്തെ ഹിജ്‌റ & ഇംഗ്ലീഷ് തീയതി:";
        document.getElementById('specialDaysHeading').textContent = "പ്രധാനപ്പെട്ട വിശേഷ ദിനങ്ങൾ:";
        document.getElementById('hijriBadge').textContent = "ഇസ്ലാമിക് കലണ്ടർ";
        document.getElementById('ev1').innerHTML = "🌙 <b>റമദാൻ 1:</b> വരാനിരിക്കുന്നു";
        document.getElementById('ev2').innerHTML = "🕋 <b>അറഫാ ദിനം:</b> ദുൽഹിജ്ജ 9";
        document.getElementById('ev3').innerHTML = "🎉 <b>പെരുന്നാൾ (ഈദുൽ ഫിത്ർ):</b> ശവ്വാൽ 1";
    }
}

document.addEventListener("DOMContentLoaded", applyHijriCardLanguage);
document.addEventListener("swalath-language-changed", applyHijriCardLanguage);
</script>
