<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hijri Calendar & Special Days</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="padding: 20px; background: var(--sw-bg);">

    <!-- PREMIUM HIJRI CALENDAR & SPECIAL DAYS CARD -->
    <div class="khatam-card" id="hijriCard" style="background: linear-gradient(135deg, #ffffff 0%, #f7f9f6 100%); border: 2px solid #ddc486; border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 6px 20px rgba(18,61,52,0.08); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
        
        <!-- Header -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; border-bottom: 1px solid #e6dfd0; padding-bottom: 10px;">
            <h3 id="hijriCardTitle" data-i18n="hijriCardTitle" style="color: #123d34; font-size: 17px; margin: 0; font-weight: 700;">🗓️ ഹിജ്‌റ കലണ്ടറും വിശേഷ ദിവസങ്ങളും</h3>
            <span style="background: #123d34; color: #ddc486; font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: bold;" id="hijriBadge" data-i18n="hijriBadge">ഇസ്ലാമിക് കലണ്ടർ</span>
        </div>

        <!-- Date Display Box -->
        <div class="target-box" style="background: #edf3eb; border: 1.5px solid #123d34; border-radius: 14px; padding: 14px; text-align: center; margin-bottom: 15px; box-shadow: inset 0 2px 5px rgba(18,61,52,0.03);">
            <h4 id="hijriDateLabel" data-i18n="hijriDateLabel" style="color: #123d34; margin: 0 0 6px 0; font-size: 13px; font-weight: 600;">ഇന്നത്തെ ഹിജ്‌റ & ഇംഗ്ലീഷ് തീയതി:</h4>
            <p id="currentHijriText" style="font-size: 15px; color: #123d34; margin: 0 0 4px 0; font-weight: bold;">ലോഡ് ചെയ്യുന്നു...</p>
            <p id="currentEnglishText" style="font-size: 12px; color: #555; margin: 0; font-weight: 500;">Loading...</p>
        </div>

        <!-- Special Days Section -->
        <div style="font-size: 13px;">
            <strong id="specialDaysHeading" data-i18n="specialDaysHeading" style="color: #123d34; display: block; margin-bottom: 8px; font-weight: 600;">പ്രധാനപ്പെട്ട വിശേഷ ദിനങ്ങൾ:</strong>
            <div style="background: #fffdf8; padding: 12px; border-radius: 12px; border: 1.5px dashed #ddc486; line-height: 1.7; color: #333;">
                <p id="ev1" data-i18n="ev1Text" style="margin: 6px 0; display: flex; align-items: center; gap: 6px;">🌙 റമദാൻ 1: വരാനിരിക്കുന്നു</p>
                <p id="ev2" data-i18n="ev2Text" style="margin: 6px 0; display: flex; align-items: center; gap: 6px;">🕋 അറഫാ ദിനം: ദുൽഹിജ്ജ 9</p>
                <p id="ev3" data-i18n="ev3Text" style="margin: 6px 0; display: flex; align-items: center; gap: 6px;">🎉 പെരുന്നാൾ: ശവ്വാൽ 1</p>
            </div>
        </div>
    </div>

    <script src="language.js"></script>
    <script>
    function applyHijriCardLanguage() {
        const currentLang = window.SwalathLanguage && typeof window.SwalathLanguage.getCurrent === "function" 
            ? window.SwalathLanguage.getCurrent() 
            : (localStorage.getItem('swalath-language') || 'ml');
        
        // Apply translations using language.js system if available
        if (window.SwalathLanguage && typeof window.SwalathLanguage.apply === "function") {
            window.SwalathLanguage.apply(currentLang);
        }

        const today = new Date();
        const engOptions = { year: 'numeric', month: 'long', day: 'numeric' };
        const engLocale = currentLang === 'ar' ? 'ar-SA' : (currentLang === 'en' ? 'en-US' : 'ml-IN');
        const engDateStr = today.toLocaleDateString(engLocale, engOptions);
        
        const engTextEl = document.getElementById('currentEnglishText');
        if (engTextEl) {
            engTextEl.textContent = engDateStr;
        }

        try {
            const hijriFormatter = new Intl.DateTimeFormat(currentLang === 'ar' ? 'ar-SA-u-ca-islamic' : (currentLang === 'en' ? 'en-US-u-ca-islamic' : 'ar-SA-u-ca-islamic-umalqura'), {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });
            const hijriDateStr = hijriFormatter.format(today);
            const hijriTextEl = document.getElementById('currentHijriText');
            if (hijriTextEl) {
                hijriTextEl.textContent = hijriDateStr;
            }
        } catch (e) {
            document.getElementById('currentHijriText').textContent = "1448 ഹിജ്‌റ";
        }
    }

    document.addEventListener("DOMContentLoaded", applyHijriCardLanguage);
    document.addEventListener("swalath-language-changed", applyHijriCardLanguage);
    </script>
</body>
</html>
