    text: `الْفَاتِحَةْ إِلَى أَرْوَاحِ الْأَوْلِيَاءِ وَالشُّهَدَاءِ وَالصَّالِحِينَ وَالْأَئِمَّةِ الرَّاشِدِينَ ❁ وَإِلَى أَرْوَاحِ وَالِدِينَا وَمَشَايِخِنَا وَذَوِي الْحُقُوقِ عَلَيْنَا وَعَلَيْهِمْ أَجْمَعِينَ ❁ ثُمَّ إِلَى أَرْوَاحِ أَمْوَاتِ الْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ وَالْمُسْلِمِينَ وَالْمُسْلِمَاتِ ❁ أَنَّ اللَّهَ يَغْفِرُ لَهُمْ وَيَرْحَمُهُمْ وَيُعْلِي دَرَجَاتِهِمْ فِي الْجَنَّةِ وَيُعِيدُ عَلَيْنَا مِنْ أَسْرَارِهِمْ وَأَنْوَارِهِمْ وَعُلُومِهِمْ وَبَرَكَاتِهِمْ فِي الدِّينِ وَالدُّنْيَا وَالْآخِرَةِ ❁ الْفَاتِحَةْ`,
    repeat: "الْفَاتِحَة"
},

{
    text: `الْفَاتِحَةْ بِالْقَبُولِ وَتَمَامِ كُلِّ سُؤْلٍ وَمَأْمُولٍ وَصَلَاحِ الشَّأْنِ ظَاهِرًا وَبَاطِنًا فِي الدِّينِ وَالدُّنْيَا وَالْآخِرَةِ ❁ دَافِعَةً لِكُلِّ شَرٍّ جَالِبَةً لِكُلِّ خَيْرٍ لَنَا وَلِوَالِدِينَا وَأَوْلَادِنَا وَأَحْبَابِنَا وَمَشَايِخِنَا فِي الدِّينِ مَعَ اللُّطْفِ وَالْعَافِيَةِ وَعَلَى نِيَّةِ أَنَّ اللَّهَ يُنَوِّرُ قُلُوبَنَا وَقَوَالِبَنَا مَعَ الْهُدَى وَالتُّقَى وَالْعَفَافِ وَالْغِنَى وَالْمَوْتِ عَلَى دِينِ الْإِسْلَامِ وَالْإِيمَانِ بِلَا مِحْنَةٍ وَلَا امْتِحَانٍ بِحَقِّ سَيِّدِ وَلَدِ عَدْنَانَ وَعَلَى كُلِّ نِيَّةٍ صَالِحَةٍ ❁ وَإِلَى حَضْرَةِ النَّبِيِّ مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَآلِهِ وَسَلَّمَ ❁ الْفَاتِحَةْ`,
    repeat: "الْفَاتِحَة"
}

];

function renderRatib() {
    const container = document.getElementById("ratib-content");

    container.innerHTML = ratibReadings.map(item => `
        <div class="reading-card">
            <div class="arabic">${item.text}</div>
            ${item.repeat ? `<span class="repeat">${item.repeat}</span>` : ""}
        </div>
    `).join("");
}

function updatePageLanguage() {

    const lang = window.SwalathLanguage &&
        typeof window.SwalathLanguage.getCurrent === "function"
        ? window.SwalathLanguage.getCurrent()
        : (localStorage.getItem("swalath-language") || "en");

    const ml = lang === "ml";

    document.documentElement.lang = ml ? "ml" : "en";

    document.getElementById("page-title").textContent =
        ml ? "റാത്തീബുൽ അത്വാസ്" : "Ratib Al-Attas";

    document.getElementById("page-subtitle").textContent =
        ml ? "റാത്തീബും സമാപന ദുആകളും" : "Ratib and Closing Duas";

    document.getElementById("back-button").textContent =
        ml ? "← തിരികെ" : "← Back";

    document.getElementById("intro-text").textContent =
        ml
        ? "ശ്രദ്ധയോടെയും ശാന്തതയോടെയും പാരായണം ചെയ്യുക."
        : "Recite with attention and tranquillity.";

    document.getElementById("ratib-heading").textContent =
        ml ? "റാത്തീബുൽ അത്വാസ്" : "Ratib Al-Attas";

    document.getElementById("bottom-back").textContent =
        ml
        ? "← റാത്തീബ് പട്ടികയിലേക്ക് മടങ്ങുക"
        : "← Back to Ratib List";
}

window.addEventListener("load", function() {

    if (localStorage.getItem("swalathDarkMode") === "on") {
        document.body.classList.add("dark");
    }

    renderRatib();
    updatePageLanguage();
});

document.addEventListener("swalath-language-changed", function() {
    updatePageLanguage();
});

</script>

</body>
</html>
