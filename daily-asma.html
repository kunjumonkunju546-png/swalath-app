  /* TODAY */

  function getDayNumber() {

    const start = new Date(2026, 0, 1);

    const today = new Date();

    start.setHours(0,0,0,0);
    today.setHours(0,0,0,0);

    const difference =
      Math.floor(
        (today - start) / (1000 * 60 * 60 * 24)
      );

    return difference % asma.length;

  }


  function showDailyName() {

    const index = getDayNumber();

    const item = asma[index];

    document.getElementById("asmaNumber").textContent =
      "പേര് " + (index + 1) + " / " + asma.length;

    document.getElementById("asmaArabic").textContent =
      item[0];

    document.getElementById("asmaName").textContent =
      item[1];

    document.getElementById("asmaMeaning").textContent =
      item[2];

    document.getElementById("todayDate").textContent =
      new Date().toLocaleDateString("ml-IN", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      });

  }


  /* ALL NAMES */

  function showAllNames() {

    const box =
      document.getElementById("allNames");

    box.innerHTML = "";

    asma.forEach(function(item, index) {

      const row =
        document.createElement("div");

      row.className = "name-row";

      row.innerHTML = `
        <div class="name-row-number">
          ${index + 1}
        </div>

        <div>
          <div class="name-row-arabic">
            ${item[0]}
          </div>

          <div class="name-row-meaning">
            ${item[1]} — ${item[2]}
          </div>
        </div>
      `;

      box.appendChild(row);

    });

  }


  function toggleAll() {

    const box =
      document.getElementById("allNames");

    const button =
      document.querySelector(".all-button");

    if (box.classList.contains("show")) {

      box.classList.remove("show");

      button.textContent =
        "📖 99 നാമങ്ങൾ കാണുക";

    } else {

      box.classList.add("show");

      button.textContent =
        "⬆️ 99 നാമങ്ങൾ അടയ്ക്കുക";

    }

  }


  /* HOME */

  function goHome() {
    window.location.href = "index.html";
  }


  /* DARK MODE */

  function toggleDark() {

    document.body.classList.toggle("dark");

    if (document.body.classList.contains("dark")) {

      localStorage.setItem(
        "swalathDarkMode",
        "on"
      );

    } else {

      localStorage.setItem(
        "swalathDarkMode",
        "off"
      );

    }

  }


  /* START */

  window.onload = function() {

    showDailyName();

    showAllNames();

    const darkMode =
      localStorage.getItem("swalathDarkMode");

    if (darkMode === "on") {

      document.body.classList.add("dark");

    }

  };

</script>
